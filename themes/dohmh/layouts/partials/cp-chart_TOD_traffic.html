{{/*
    cp-chart_TOD_traffic.html
    Time-of-day traffic and PM2.5 chart for the congestion pricing report.
    Renders a Vega-Lite faceted chart filtered to one monitoring site at a time.
    Site switching is driven by buttons in #todSiteButtons (left column).
    Data source: data/rtpm_traffic.csv
*/}}

<!-- Two-column layout: site buttons (left) + chart (right) -->
<div class="row justify-content-center mt-2">
    <div class="col-2">
        <!-- Buttons are generated by renderTODButtons() below -->
        <div class="sticky-top" style="top: 42px;">
            <div id="todSiteButtons" class="btn-group-vertical w-100" style="gap: 6px;" role="group" aria-label="Choose site"></div>
        </div>
    </div>
    <div class="col-10">
        <div id="cpVisTOD" style="width: 100%" class="mt-2"></div>
    </div>
</div>

<style>
    /* Constrain Vega embed height to prevent oversized canvases */
    .vega-embed {
        height: 200px !important;
    }
</style>

<script>
    // ID of the chart container div; referenced throughout for rendering and clearing
    const TOD_CONTAINER_ID = "cpVisTOD";

    // Sites present in rtpm_traffic.csv — must match the Site column values exactly
    const tod_site_names = ["Deegan", "Cross Bronx", "BQE", "SI Expwy", "FDR", "Trans-Manhattan", "Van Wyck"];
    // Tracks the currently selected site; updated on each button click
    let todCurrentSite = "Deegan";

    // -------------------------------------------------------------------------
    // Base Vega-Lite spec
    // The filter in transform[0] is a placeholder — specForTODSite() patches it
    // before each render so we never mutate this object directly.
    // -------------------------------------------------------------------------
    const todBaseSpec = {
        $schema: "https://vega.github.io/schema/vega-lite/v5.json",

        // Global chart styling — fonts, axis appearance, legend placement, color palette
        config: {
            header: {
                labelAlign: "left",
                labelAnchor: "start",
                labelFont: "Helvetica",
                labelFontWeight: "bold",
                labelFontSize: 12,
            },

            view: { stroke: null },
            axisX: { labelAngle: 0, domain: false },
            axisY: {
                domain: false,
                ticks: false,
                tickCount: 3,
                orient: "left",
                title: null,
            },

            legend: { orient: "right", title: "" },

            range: {
                category: ["#ffffb2", "#fecc5c", "#fd8d3c", "#e31a1c"],
            },
        },

        // CSV data source (served as a Hugo static asset)
        data: {
            url: "data/rtpm_traffic.csv",
        },

        // Each facet panel gets its own y-axis scale so panels with different units are readable
        resolve: { scale: { y: "independent" } },

        // Data transformations applied before encoding — filtering, calculated fields, label mapping
        transform: [
            // Placeholder — replaced by specForTODSite() before each render
            { filter: "datum.Site === 'BQE'" },
            {
                calculate: "datum.Value + ' (' + datum.Units + ')'",
                as: "ValueWithUnits",
            },
            {
                calculate: "datum.Measure + ' (' + datum.Units + ')'",
                as: "ParamWithUnit",
            },
            {
                // Expand terse Time codes into readable labels for the x-axis
                calculate: "datum.Time === 'Pre' ? 'Before congestion pricing' : datum.Time === 'Post' ? 'With congestion pricing' : datum.Time",
                as: "TimeLabel",
            },
        ],

        // One panel per measure (e.g. Traffic, PM2.5), laid out as a row of small multiples
        facet: {
            field: "ParamWithUnit",
            title: null,
            // Put traffic volume first; remaining panels sort alphabetically
            sort: ["Traffic (vehicles per hour)"],
        },

        // The repeated chart spec applied to each facet panel
        spec: {
            width: 300,
            height: 200,
            encoding: {
                x: {
                    field: "TimeLabel",
                    type: "nominal",
                    sort: "ascending",
                    title: null,
                },
            },
            layer: [
                // Layer 1: lines connecting Pre → Post for each TOD period
                {
                    mark: { type: "line", strokeDash: [0, 0] },

                    encoding: {
                        y: { field: "Value", type: "quantitative" },

                        color: {
                            field: "TOD",

                            scale: {
                                domain: [
                                    "Morning rush",
                                    "Midday",
                                    "Evening rush",
                                    "Overnight",
                                ],

                                range: ["#fdd49e", "#fc8d59", "#d7301f", "#7f0000"],
                            },
                        },
                    },
                },

                // Layer 2: dots at each data point, with tooltip
                {
                    mark: { type: "circle", size: 75 },

                    encoding: {
                        y: {
                            field: "Value",
                            type: "quantitative",
                            // Force y-axis to start at 0 so differences are proportional
                            scale: { domainMin: 0, nice: false },
                        },

                        color: {
                            field: "TOD",

                            scale: {
                                domain: [
                                    "Morning rush",
                                    "Midday",
                                    "Evening rush",
                                    "Overnight",
                                ],

                                range: ["#fdd49e", "#fc8d59", "#d7301f", "#7f0000"],
                            },
                        },

                        tooltip: [
                            { field: "Site", title: "Site", type: "nominal" },
                            { field: "TOD", title: "Time of day", type: "nominal" },
                            { field: "TimeLabel", title: "Period", type: "nominal" },
                            { field: "Measure", title: "Measure", type: "nominal" },
                            { field: "ValueWithUnits", title: "Value", type: "nominal" },
                        ],
                    },
                },
            ],
        },
    };

    // -------------------------------------------------------------------------
    // specForTODSite(site)
    // Returns a deep clone of todBaseSpec with the Site filter patched in.
    // Cloning is required because vegaEmbed may mutate the spec object it receives,
    // and we need todBaseSpec to remain pristine for subsequent site switches.
    // -------------------------------------------------------------------------
    function specForTODSite(site) {
        const spec = typeof structuredClone === "function"
            ? structuredClone(todBaseSpec)
            : JSON.parse(JSON.stringify(todBaseSpec));
        spec.transform[0].filter = `datum.Site === '${site}'`;
        return spec;
    }

    // -------------------------------------------------------------------------
    // renderTODChart(site)
    // Clears the container and re-renders the chart for the given site.
    // -------------------------------------------------------------------------
    async function renderTODChart(site) {
        const el = document.getElementById(TOD_CONTAINER_ID);
        if (!el) return;

        // Clear the previous render before embedding a new one
        el.innerHTML = "";

        try {
            await vegaEmbed(el, specForTODSite(site), { actions: false, renderer: "canvas" });
        } catch (err) {
            console.error("TOD Traffic Vega render failed:", err);
            el.innerHTML =
                "<pre style='white-space:pre-wrap'>Chart failed to render. See console.</pre>";
        }
    }

    // -------------------------------------------------------------------------
    // renderTODButtons()
    // Populates #todSiteButtons with one button per site.
    // IDs are prefixed "tod-" to avoid collisions with #cpSiteButtons (cp-chart.html),
    // which is included on the same page.
    // -------------------------------------------------------------------------
    function renderTODButtons() {
        const btnWrap = document.getElementById("todSiteButtons");
        if (!btnWrap) return;
        btnWrap.innerHTML = "";

        // Create one button per site and wire up the click handler
        tod_site_names.forEach((site) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.id = "tod-" + site.replaceAll(" ", "-"); // e.g. "tod-Cross-Bronx"
            btn.className = "btn btn-sm btn-outline-dark fs-xs";
            btn.textContent = site;

            if (site === todCurrentSite) btn.classList.add("active");

            // On click: update state, highlight the active button, update prose, re-render chart
            btn.addEventListener("click", async () => {
                todCurrentSite = site;

                // Toggle active state across all buttons in this group
                [...btnWrap.querySelectorAll("button")].forEach((b) =>
                    b.classList.remove("active")
                );
                btn.classList.add("active");

                // Update the site name in the prose above the chart (see congestion-pricing-report.html)
                const todSiteTitleEl = document.getElementById("tod-site-name");
                if (todSiteTitleEl) todSiteTitleEl.textContent = site;

                await renderTODChart(site);
            });

            btnWrap.appendChild(btn);
        });
    }

    // -------------------------------------------------------------------------
    // Initialization — wait for DOM so #todSiteButtons and #cpVisTOD exist
    // -------------------------------------------------------------------------
    document.addEventListener("DOMContentLoaded", async () => {
        renderTODButtons();
        await renderTODChart(todCurrentSite);
    });
</script>

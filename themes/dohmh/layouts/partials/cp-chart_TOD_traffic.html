
<div id="cpVisTOD" style="width: 100%" class="mt-2"></div>


  <style>
    .vega-embed {
      height: 200px !important;
    }
  </style>

  <script>
    const TOD_CONTAINER_ID = "cpVisTOD";

    // Base spec
    const todTrafficSpec = {
      $schema: "https://vega.github.io/schema/vega-lite/v5.json",

      config: {
        header: {
          labelAlign: "left",
          labelAnchor: "start",
          labelFont: "Helvetica",
          labelFontWeight: "bold",
          labelFontSize: 12,
        },

        view: { stroke: null },
        axisX: { labelAngle: 0, domain: false },
        axisY: {
          domain: false,
          ticks: false,
          tickCount: 3,
          orient: "left",
          title: null,
        },

        legend: { orient: "right", title: "" },

        range: {
          category: ["#ffffb2", "#fecc5c", "#fd8d3c", "#e31a1c"],
        },
      },

      data: {
        url: "https://gist.githubusercontent.com/etorem/0ed68821facd6643a70c35f1ab205804/raw/630c10f1e9165749a513ccf9e8660225d229240c/rtpm_traffic_3.csv",
      },

      resolve: { scale: { y: "independent" } },

      transform: [
        { filter: "datum.Site === 'BQE'" },

        {
          calculate: "datum.Value + ' (' + datum.Units + ')'",

          as: "ValueWithUnits",
        },

        {
          calculate: "datum.Measure + ' (' + datum.Units + ')'",

          as: "ParamWithUnit",
        },

        {
          calculate:
            "datum.Time === 'Pre' ? 'Before congestion pricing' : datum.Time === 'Post' ? 'With congestion pricing' : datum.Time",

          as: "TimeLabel",
        },
      ],

      facet: {
        field: "ParamWithUnit",

        title: null,

        sort: ["Traffic (vehicles per hour)"],
      },

      spec: {
        width: 300,
        height: 200,
        encoding: {
          x: {
            field: "TimeLabel",

            type: "nominal",

            sort: "ascending",

            title: null,
          },
        },
        layer: [
          {
            mark: { type: "line", strokeDash: [0, 0] },

            encoding: {
              y: { field: "Value", type: "quantitative" },

              color: {
                field: "TOD",

                scale: {
                  domain: [
                    "Morning rush",
                    "Midday",
                    "Evening rush",
                    "Overnight",
                  ],

                  range: ["#fdd49e", "#fc8d59", "#d7301f", "#7f0000"],
                },
              },
            },
          },

          {
            mark: { type: "circle", size: 75 },

            encoding: {
              y: {
                field: "Value",

                type: "quantitative",

                scale: { domainMin: 0, nice: false },
              },

              color: {
                field: "TOD",

                scale: {
                  domain: [
                    "Morning rush",
                    "Midday",
                    "Evening rush",
                    "Overnight",
                  ],

                  range: ["#fdd49e", "#fc8d59", "#d7301f", "#7f0000"],
                },
              },

              tooltip: [
                { field: "Site", title: "Site", type: "nominal" },

                { field: "TOD", title: "Time of day", type: "nominal" },

                { field: "TimeLabel", title: "Period", type: "nominal" },

                { field: "Measure", title: "Measure", type: "nominal" },

                { field: "ValueWithUnits", title: "Value", type: "nominal" },
              ],
            },
          },
        ],
      },
    };

    async function renderTODChart() {
      const el = document.getElementById(TOD_CONTAINER_ID);
      if (!el) return;

      try {
        await vegaEmbed(el, todTrafficSpec, { actions: false, renderer: "canvas" });
      } catch (err) {
        console.error("TOD Traffic Vega render failed:", err);
        el.innerHTML =
          "<pre style='white-space:pre-wrap'>Chart failed to render. See console.</pre>";
      }
    }

    renderTODChart();
  </script>

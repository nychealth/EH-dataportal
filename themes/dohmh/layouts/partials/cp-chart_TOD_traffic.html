{{/*
    cp-chart_TOD_traffic.html
    Time-of-day traffic and PM2.5 chart for the congestion pricing report.
    Renders a Vega-Lite faceted chart filtered to one monitoring site at a time.
    Site switching is driven by buttons in #todSiteButtons (left column).
    Data source: data/rtpm_traffic.csv
*/}}

<!-- Two-column layout: site buttons (left) + chart (right) -->
<div class="row justify-content-center mt-2">
    <div class="col-12 col-md-2">
        <!-- Buttons are generated by renderTODButtons() below -->
        <div class="sticky-top" style="top: 42px;">
            <div id="todSiteButtons" class="btn-group-vertical w-100" style="gap: 6px;" role="group" aria-label="Choose site"></div>
        </div>
    </div>
    <div class="col-12 col-md-10">
        <div id="cpVisTOD" style="width: 100%" class="mt-2"></div>
    </div>
</div>

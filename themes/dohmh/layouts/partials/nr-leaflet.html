<div id="map" style="width: 100%; height: 450px"></div>

<script>

  var geocode = `{{ .Params.geocode }}`
  console.log('GEOCODE:', geocode)

  var lat = 40.715554;
  var lng = -74.0026642;
  var zoom = 10;

  const UHF42 = "geojson/UHF42.geojson";

  var map = L.map("map", { zoomControl: false }).setView([lat, lng], zoom); // [Lat,Long],Zoom
  L.tileLayer(
    "https://api.maptiler.com/maps/basic-v2/{z}/{x}/{y}.png?key=dwIJ8hO2KsTMegUfEpYE",
    {
      maxZoom: 15,
      attribution:
        '<a href="https://www.maptiler.com/copyright/" target="_blank">&copy; MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">&copy; OpenStreetMap contributors</a>',
    }
  ).addTo(map);

  L.control
    .scale({
      metric: false,
      position: "bottomleft",
    })
    .addTo(map);

  // add and style geographies
  var geog;
  fetch("{{ .Site.BaseURL }}geojson/UHF42.geojson")
    .then((response) => response.text())
    .then((text) => {
      // console.log("Raw text:", text); // ← check this!
      const data = JSON.parse(text);
      geog = L.geoJSON(data, {
        style,
        onEachFeature,
      }).addTo(map);


    // After 2 seconds, optionally zoom to the neighborhood that matches the geocode
    setTimeout(() => {
      if (geocode && geocode.trim() !== "") {
        const targetLayer = Object.values(geog._layers).find(
          (layer) => layer.feature.properties.GEOCODE == geocode
        );

        if (targetLayer) {
          map.fitBounds(targetLayer.getBounds());

          // Optionally, apply highlight style like in your click handler
          geog.resetStyle();
          targetLayer.setStyle({
            weight: 3,
            color: "#008939",
            dashArray: "3",
            fillOpacity: 0.5,
          });
          targetLayer.bringToFront();
        } else {
          console.warn("No matching GEOCODE found:", geocode);
        }
      } else {
        console.log("No geocode provided; skipping zoom.");
      }
    }, 500);

    })
    .catch((err) => console.error("Error loading GeoJSON:", err));

  function style(feature) {
    return {
      weight: 1.5,
      opacity: 1,
      color: "black",
      dashArray: "1",
      fillOpacity: 0.05,
      fillColor: "#008939",
    };
  }

  // And what to do on mouseover, mouseout, and click
  function onEachFeature(feature, layer) {
    layer.on({
      mouseover: highlightFeature,
      mouseout: resetHighlight,
      //  click: zoomToFeature // let's replace this with... something else!,
      click: selectNeighborhood,
    });
    layer._leaflet_id = feature.properties.GEOCODE; // gives each item an ID based on GEOCODE
  }

  function highlightFeature(e) {
      const layer = e.target;

      layer.setStyle({
        weight: 5,
        color: "#444",
        dashArray: "",
        // Do NOT touch fillColor or fillOpacity
      });

      layer.bringToFront();
    }

    function resetHighlight(e) {
      const layer = e.target;

      layer.setStyle({
        weight: 1.5,
        color: "black",
        dashArray: "1",
      });
    }


  // USE MAP AS NAVIGATION
function selectNeighborhood(e) {
  geog.resetStyle();
  const layer = e.target;

  layer.setStyle({
    weight: 3,
    color: '#008939',
    dashArray: "3",
    fillOpacity: 0.5,
  });

  layer.bringToFront();

  const geocodeClicked = layer.feature.properties.GEOCODE;

  // Find the matching neighborhood
  const match = neighborhoods.find(
    (n) => n.UHF_id == geocodeClicked
  );

  if (match && match.page_name) {
    // Get the current URL parts
    const parts = window.location.pathname.split("/");

    // Replace the 3rd index (neighborhood slug) with the new one
    parts[3] = match.page_name;

    // Build the new path
    const newPath = parts.join("/");

    // Redirect
    window.location.href = newPath;
  } else {
    console.warn("No matching neighborhood for GEOCODE:", geocodeClicked);
  }
}

</script>

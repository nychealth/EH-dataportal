<div id="map" style="width: 100%; height:100%"></div>

<style>
    #map:hover {
        cursor: pointer;
    }
</style>

<script>
    
    // --------------------------------------------------------------------------------------------------- // 
    // ---------- Establish initial variables ---------- // 
    // --------------------------------------------------------------------------------------------------- // 
    
    let geocode = `{{ .Params.geocode }}`;
    
    let lat = 40.715554;
    let lng = -74.0026642;
    let zoom = 10;
    
    // --------------------------------------------------------------------------------------------------- // 
    // ---------- Initialize map ---------- // 
    // --------------------------------------------------------------------------------------------------- // 
    
    // Leaflet's default zoom control is on: the map fits the whole city, so the buttons are how
    // a reader closes in on one neighborhood. Where a caller hides the map from assistive tech,
    // removeHiddenMapFromTabOrder takes the buttons out of the tab order with the polygons
    let map = L.map("map").setView([lat, lng], zoom); // [Lat,Long],Zoom

    L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_2vaf_1_f87644104deb54c869cef554',
    {
        maxZoom: 15,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
     }).addTo(map);
    
    L.control
    .scale({
        metric: false,
        position: "bottomleft",
    })
    .addTo(map);
    
    // add and style geographies
    
    let uhf_geojson;
    
    fetch({{ relURL "geojson/UHF42.geojson" }})
        .then((response) => response.text())
        .then((text) => {

            // console.log("Raw text:", text); // ← check this!
            
            const data = JSON.parse(text);

            uhf_geojson = L.geoJSON(data, {

                style: style,
                onEachFeature: onEachFeature,
                filter: (feature) => feature.properties.GEOCODE != 0

            }).addTo(map);

            // addTo is synchronous, so every polygon has its <path> by here
            nameNeighborhoodPolygons();


            // highlight the page's own neighborhood: geocode is set only on the 42
            // neighborhood index pages

            if (geocode && geocode.trim() !== "") {

                // extract selected neighborhood layer

                const targetLayer = Object.values(uhf_geojson._layers).find(

                    (layer) => layer.feature.properties.GEOCODE == geocode

                );

                if (targetLayer) {

                    // reset style

                    uhf_geojson.resetStyle();

                    // apply highlight style

                    targetLayer.setStyle({
                        weight: 3,
                        color: "#008939",
                        dashArray: "3",
                        fillOpacity: 0.5,
                    });

                    // bring neighborhood to the front

                    targetLayer.bringToFront();

                } else {

                    console.warn("No matching GEOCODE found:", geocode);

                }

            }

            // Every page fits the whole city rather than keeping the fixed zoom-10 view, so the
            // city fills whatever box the caller gives it — at a fixed zoom a wider container
            // just adds water on both sides.
            //
            // The neighborhood index pages used to fly to their own neighborhood instead, which
            // left most polygons outside the map: a centre-point hit test reached 10 of 42 on
            // east_new_york/, at zoom 12 [verified 2026-10-19, scripts/nr-r14-probe.mjs, audit
            // row N-026]. The polygons are links to the other 41 neighborhoods, so that framing
            // took away the navigation it drew. The highlight above still marks the page's own
            // neighborhood, and the zoom control lets a reader close in on it. The report page's
            // map.js made the same change on 2026-09-15 for the same reason.
            //
            // zoomSnap has to be 0 because the default of 1 makes fitBounds round *down* to a
            // whole zoom level — measured 2026-08-09, that left the city spanning 59% of a
            // 679px-wide box.
            map.options.zoomSnap = 0;

            map.fitBounds(uhf_geojson.getBounds(), { padding: [10, 10] });

            removeHiddenMapFromTabOrder();

        })
        .catch((err) => console.error("Error loading GeoJSON:", err));

    // A caller may wrap this map in aria-hidden="true" — nr-neighborhood-picker.html does,
    // because the 42-link neighborhood list beside it is the map's text equivalent. A hidden
    // subtree must hold no keyboard stops, or a keyboard user tabs through positions a screen
    // reader is told do not exist. Two sources of them here, and neither is an authored
    // tabindex: Leaflet's `keyboard` option puts tabindex="0" on the container, and the
    // polygons follow it into the tab order carrying no tabindex attribute of their own
    // [verified 2026-08-11: 46 stops inside the hidden subtree — container, 42 polygons,
    // 3 attribution links]. Setting tabindex="-1" explicitly removes an element from the
    // sequential order whatever put it there. Keyed off the ancestor rather than a parameter
    // so the report page, whose map is NOT hidden and IS the neighborhood switcher, is untouched.

    function removeHiddenMapFromTabOrder() {

        const container = map.getContainer();

        if (!container.closest('[aria-hidden="true"]')) return;

        container.setAttribute("tabindex", "-1");

        container
            .querySelectorAll("a, path, [tabindex]")
            .forEach((el) => el.setAttribute("tabindex", "-1"));

    }

    // define styl function

    function style(feature) {
        return {
            weight: 1.5,
            opacity: 1,
            color: "black",
            dashArray: "1",
            fillOpacity: 0.05,
            fillColor: "#008939"
        };
    }
    
    // And what to do on mouseover, mouseout, and click

    function onEachFeature(feature, layer) {

        // bind tooltip to each feature i.e. neighborhood, open on mousover. Same string the
        // aria-label carries, so the visible label is contained in the accessible name

        layer.bindTooltip(neighborhoodDisplayName(feature), {permanent: false, opacity: 0.9, className: "fs-md"});

        // set event handlers for each layer

        layer.on({

            mouseover: highlightFeature,
            mouseout: resetHighlight,
            click: selectNeighborhood,
            keydown: onNeighborhoodKeyDown,

        });

    }

    // The name the rest of the site uses: uhflist's UHF_name, which the neighborhood list,
    // the page titles and the report map show. The geojson's GEONAME differs on 4 of the 42
    // ("Washington Heights - Inwood" against "Washington Heights") [verified 2026-10-19:
    // static/geojson/UHF42.geojson joined to data/globals/uhflist.json on GEOCODE = UHF_id].
    // GEONAME is the fallback for a page that loads no uhflist

    function neighborhoodDisplayName(feature) {

        const geocode = feature.properties.GEOCODE;

        const match = typeof neighborhoods !== "undefined"
            && neighborhoods.find(n => n.UHF_id == geocode);

        return (match && match.UHF_name) || feature.properties.GEONAME;

    }

    // Names the polygons for the accessibility tree, the way assets/js/nr-report/map.js
    // nameMapPolygons does for the report page. Leaflet already puts the polygons in the tab
    // order, unnamed. role="button" because Enter and Space now activate them (below). On the
    // landing page and topic indexes the map sits inside aria-hidden="true" and
    // removeHiddenMapFromTabOrder takes these out of the tab order, so the names reach only
    // the neighborhood index pages, where the map is not hidden

    function nameNeighborhoodPolygons() {

        uhf_geojson.eachLayer(layer => {

            const el = layer.getElement();

            if (!el) return;

            el.setAttribute("role", "button");
            el.setAttribute("aria-label", neighborhoodDisplayName(layer.feature));

        });

    }

    // Enter and Space on a focused polygon do what a click does. Leaflet's map container
    // already routes keydown to the layer under focus; nothing here was listening for it

    function onNeighborhoodKeyDown(e) {

        const key = e.originalEvent && e.originalEvent.key;

        if (key !== "Enter" && key !== " " && key !== "Spacebar") return;

        // Space would otherwise scroll the page as it navigates away
        e.originalEvent.preventDefault();

        selectNeighborhood(e);

    }

    // define function that styles highlighted layer
    
    function highlightFeature(e) {
        
        // console.log("highlightFeature", e);
        
        const layer = e.target;
        
        layer.setStyle({
            weight: 5,
            color: "#444",
            dashArray: "",
            // Do NOT touch fillColor or fillOpacity
        });
        
        layer.bringToFront();

        // layer.openTooltip();
        
        // let tooltip = layer.getTooltip();
        // console.log("tooltip", tooltip);
        
    }

    // define function that resets layer style
    
    function resetHighlight(e) {

        const layer = e.target;

        // layer.closeTooltip();
        
        layer.setStyle({
            weight: 1.5,
            color: "black",
            dashArray: "1",
        });

    }
    
    // --------------------------------------------------------------------------------------------------- // 
    // ---------- this powers report and neighborhood identification, and subsequent navigation ---------- // 
    // --------------------------------------------------------------------------------------------------- // 
    
    // Declared with `var`, not `let`: the neighborhood-reports landing page also
    // declares `var intendedDestinationName` in its own inline script, and a
    // top-level `let` here collides with that `var` in shared global scope
    // ("Identifier ... has already been declared"). Two `var`s of the same name
    // don't collide, and the variable stays defined on report pages that load
    // only this partial. (used on the home page)

    var intendedDestinationName
    
    // console.log('*** GETTING TOPIC AND NEIGHBORHOOD TO POWER NAVIGATION')
    
    let chosenNeighborhood; // this is for the neighborhood you are *on*
    let chosenGeo = {{ .Params.geocode }};
    let chosenReport;       // this is the report that you are *on*
    let chosenButton;       // this is a selected button, on NR home or Topic Landing
    
    // Javascript for nav buttons:

    // Topic key -> URL slug, from data/globals/NR_topics.yml — the source the content adapter
    // generates the report URLs from, so the two cannot disagree. The landing page's topic
    // buttons use the same keys as their ids (neighborhood-reports/section.html)
    {{- $topicSlugs := dict -}}
    {{- range site.Data.globals.NR_topics -}}
        {{- $topicSlugs = merge $topicSlugs (dict .key .slug) -}}
    {{- end }}

    const topicSlugs = {{ $topicSlugs }};
    
    const topicValues = Object.values(topicSlugs);
    
    // This looks at the URL, and gets the report and matching neighborhood

    function getReportAndNeighborhood(x) {

        const url = window.location.pathname.match(/neighborhood-reports.*/)[0]
        let urlPieces = url.split("/")

        // console.log('urlPieces', urlPieces)
        
        // if it's the topic landing page, then urlPieces[1] is a topic name. We'll check for this, else, assign [1] to chosenNeighborhood

        if (topicValues.includes(urlPieces[1])) {

            chosenNeighborhood = null
            chosenReport = (urlPieces[1] && urlPieces[1].length > 2) ? urlPieces[1] : null;

        } else {

            chosenNeighborhood = (urlPieces[1] && urlPieces[1].length > 2) ? urlPieces[1] : null
            chosenReport = (urlPieces[2] && urlPieces[2].length > 2) ? urlPieces[2] : null;

        }

    }

    getReportAndNeighborhood(window.location.href)

    
    // --------------------------------------------------------------------------------------------------- // 
    // ---------- Use map as navigation ---------- // 
    // --------------------------------------------------------------------------------------------------- // 
    
    function selectNeighborhood(e) {

        uhf_geojson.resetStyle();

        const layer = e.target;
        
        layer.setStyle({
            weight: 3,
            color: '#008939',
            dashArray: "3",
            fillOpacity: 0.5,
        });
        
        layer.bringToFront();
        
        const geocodeClicked = layer.feature.properties.GEOCODE;
        
        // Find the matching neighborhood - 'neighborhoods' is a global emitted by the
        // lib-uhflist.html partial from data/globals/uhflist.json
        const match = neighborhoods.find(
            n => n.UHF_id == geocodeClicked
        );
        
        // console.log('neighborhoods:', neighborhoods)
        
        if (match && match.page_name) {

            // Report destination: a topic button's choice on the NR landing page, or the
            // topic already being read. Null on a neighborhood index, which has neither.
            const dest = intendedDestinationName || chosenReport;

            // Neighborhood-first URLs. Both shapes are pages the content adapter generates,
            // so the slug travels in the path — there is no sessionStorage hand-off left to
            // make, and no clean topic URL that would read one.
            const buildURL = dest
                ? {{ relURL "neighborhood-reports/" }} + match.page_name + '/' + dest + '/'
                : {{ relURL "neighborhood-reports/" }} + match.page_name + '/';

            // Redirect - send to new page

            window.location.href = buildURL;
            // console.log(buildURL)

        } else {
            console.warn("No matching neighborhood for GEOCODE:", geocodeClicked);
        }
    }
    
    
</script>

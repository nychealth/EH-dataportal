<div id="map" style="width: 100%; height:100%"></div>

<style>
    #map:hover {
        cursor: pointer;
    }
</style>

<script>
    
    // --------------------------------------------------------------------------------------------------- // 
    // ---------- Establish initial variables ---------- // 
    // --------------------------------------------------------------------------------------------------- // 
    
    var geocode = `{{ .Params.geocode }}`
    
    var lat = 40.715554;
    var lng = -74.0026642;
    var zoom = 10;
    
    // --------------------------------------------------------------------------------------------------- // 
    // ---------- Initialize map ---------- // 
    // --------------------------------------------------------------------------------------------------- // 
    
    let map = L.map("map", { zoomControl: false }).setView([lat, lng], zoom); // [Lat,Long],Zoom

    L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {
        maxZoom: 15,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
     }).addTo(map);
    
    L.control
    .scale({
        metric: false,
        position: "bottomleft",
    })
    .addTo(map);
    
    // add and style geographies
    
    let uhf_geojson;
    
    fetch({{ relURL "geojson/UHF42.geojson" }})
        .then((response) => response.text())
        .then((text) => {

            // console.log("Raw text:", text); // ← check this!
            
            const data = JSON.parse(text);

            uhf_geojson = L.geoJSON(data, {

                style: style,
                onEachFeature: onEachFeature,
                filter: (feature) => feature.properties.GEOCODE != 0

            }).addTo(map);
            
            
            // highlight and zoom to selected neighborhood
                
            if (geocode && geocode.trim() !== "") {

                // extract selected neighborhood layer
                
                const targetLayer = Object.values(uhf_geojson._layers).find(
                
                    (layer) => layer.feature.properties.GEOCODE == geocode
                    
                );

                // if there's a selected neighborhood, style and zoom
                
                if (targetLayer) {

                    // reset style
                    
                    uhf_geojson.resetStyle();
                    
                    // apply highlight style
                    
                    targetLayer.setStyle({
                        weight: 3,
                        color: "#008939",
                        dashArray: "3",
                        fillOpacity: 0.5,
                    });

                    // bring neighborhood to the front

                    targetLayer.bringToFront();

                    // zoom in on selected neighborhood (after half a second)

                    setTimeout(() => {
                        
                        map.flyToBounds(targetLayer.getBounds(), {duration: 0.5});

                    }, 500);
                
                    
                } else {
                    
                    console.warn("No matching GEOCODE found:", geocode);
                    
                }
                
            } else {

                // No geocode: the landing page and the five topic indexes, where the map is a
                // whole-city picker rather than a located report. Fit the UHF42 layer instead
                // of keeping the fixed zoom-10 view, so the city fills whatever box the caller
                // gives it — at a fixed zoom a wider container just adds water on both sides.

                // zoomSnap is set here rather than at construction so this stays scoped to the
                // two picker pages: the geocode branch above keeps Leaflet's whole-number
                // framing on the 42 neighborhood index pages. It has to be 0 because the
                // default of 1 makes fitBounds round *down* to a whole zoom level — measured
                // 2026-08-09, that left the city spanning 59% of a 679px-wide box.
                map.options.zoomSnap = 0;

                map.fitBounds(uhf_geojson.getBounds(), { padding: [10, 10] });

            }

            removeHiddenMapFromTabOrder();

        })
        .catch((err) => console.error("Error loading GeoJSON:", err));

    // A caller may wrap this map in aria-hidden="true" — nr-neighborhood-picker.html does,
    // because the 42-link neighborhood list beside it is the map's text equivalent. A hidden
    // subtree must hold no keyboard stops, or a keyboard user tabs through positions a screen
    // reader is told do not exist. Two sources of them here, and neither is an authored
    // tabindex: Leaflet's `keyboard` option puts tabindex="0" on the container, and the
    // polygons follow it into the tab order carrying no tabindex attribute of their own
    // [verified 2026-08-11: 46 stops inside the hidden subtree — container, 42 polygons,
    // 3 attribution links]. Setting tabindex="-1" explicitly removes an element from the
    // sequential order whatever put it there. Keyed off the ancestor rather than a parameter
    // so the report page, whose map is NOT hidden and IS the neighborhood switcher, is untouched.

    function removeHiddenMapFromTabOrder() {

        const container = map.getContainer();

        if (!container.closest('[aria-hidden="true"]')) return;

        container.setAttribute("tabindex", "-1");

        container
            .querySelectorAll("a, path, [tabindex]")
            .forEach((el) => el.setAttribute("tabindex", "-1"));

    }

    // define styl function

    function style(feature) {
        return {
            weight: 1.5,
            opacity: 1,
            color: "black",
            dashArray: "1",
            fillOpacity: 0.05,
            fillColor: "#008939"
        };
    }
    
    // And what to do on mouseover, mouseout, and click

    function onEachFeature(feature, layer) {
        
        // bind tooltip to each feature i.e. neighborhood, open on mousover
        
        layer.bindTooltip(feature.properties.GEONAME, {permanent: false, opacity: 0.9, className: "fs-md"});

        // set event handlers for each layer
        
        layer.on({
            
            mouseover: highlightFeature,
            mouseout: resetHighlight,
            click: selectNeighborhood,
            
        });
        
    }

    // define function that styles highlighted layer
    
    function highlightFeature(e) {
        
        // console.log("highlightFeature", e);
        
        const layer = e.target;
        
        layer.setStyle({
            weight: 5,
            color: "#444",
            dashArray: "",
            // Do NOT touch fillColor or fillOpacity
        });
        
        layer.bringToFront();

        // layer.openTooltip();
        
        // let tooltip = layer.getTooltip();
        // console.log("tooltip", tooltip);
        
    }

    // define function that resets layer style
    
    function resetHighlight(e) {

        const layer = e.target;

        // layer.closeTooltip();
        
        layer.setStyle({
            weight: 1.5,
            color: "black",
            dashArray: "1",
        });

    }
    
    // --------------------------------------------------------------------------------------------------- // 
    // ---------- this powers report and neighborhood identification, and subsequent navigation ---------- // 
    // --------------------------------------------------------------------------------------------------- // 
    
    var intendedDestinationName // this needs to be declared even if it's not defined (it's used on the home page)
    
    // console.log('*** GETTING TOPIC AND NEIGHBORHOOD TO POWER NAVIGATION')
    
    var chosenNeighborhood; // this is for the neighborhood you are *on*
    var chosenGeo = {{ .Params.geocode }};
    var chosenReport;       // this is the report that you are *on*
    var chosenButton;       // this is a selected button, on NR home or Topic Landing
    
    // Javascript for nav buttons:
    const topicSlugs = {
        Active: "active_design_physical_activity_and_health",
        Asthma: "asthma_and_the_environment",
        Climate: "climate_and_health",
        Housing: "housing_and_health",
        Outdoor: "outdoor_air_and_health",
    };
    
    const topicValues = Object.values(topicSlugs);
    
    // This looks at the URL, and gets the report and matching neighborhood

    function getReportAndNeighborhood(x) {

        console.log("** getReportAndNeighborhood");

        const url = window.location.pathname.match(/neighborhood-reports.*/)[0]
        var urlPieces = url.split("/")

        // console.log('urlPieces', urlPieces)
        
        // if it's the topic landing page, then urlPieces[1] is a topic name. We'll check for this, else, assign [1] to chosenNeighborhood

        if (topicValues.includes(urlPieces[1])) {

            chosenNeighborhood = null
            chosenReport = (urlPieces[1] && urlPieces[1].length > 2) ? urlPieces[1] : null;

        } else {

            chosenNeighborhood = (urlPieces[1] && urlPieces[1].length > 2) ? urlPieces[1] : null
            chosenReport = (urlPieces[2] && urlPieces[2].length > 2) ? urlPieces[2] : null;

        }
        
        console.log('Neighborhood: ', chosenNeighborhood)
        console.log('GeoCode: ', chosenGeo)
        console.log('Report:', chosenReport)
        
        pageTypeID();

    }
    
    getReportAndNeighborhood(window.location.href)
    
    // this checks the page type; there may be some things that differ based on pagetype

    function pageTypeID() {

        console.log('*** WHAT KIND OF PAGE IS THIS?')

        if (chosenNeighborhood == null && chosenReport == null) {

            console.log("NR Landing page")

        } else if (chosenNeighborhood && chosenReport) {

            console.log("Output for: ", chosenNeighborhood, chosenReport)

        } else if (chosenReport && !chosenNeighborhood) {

            console.log("Topic landing for: ", chosenReport)

        } else {

            console.log("Neighborhood landing for: ", chosenNeighborhood)

        }
        
    }
    
    
    // --------------------------------------------------------------------------------------------------- // 
    // ---------- Use map as navigation ---------- // 
    // --------------------------------------------------------------------------------------------------- // 
    
    function selectNeighborhood(e) {

        console.log("selectNeighborhood");

        uhf_geojson.resetStyle();

        const layer = e.target;
        
        layer.setStyle({
            weight: 3,
            color: '#008939',
            dashArray: "3",
            fillOpacity: 0.5,
        });
        
        layer.bringToFront();
        
        const geocodeClicked = layer.feature.properties.GEOCODE;
        
        // Find the matching neighborhood - 'neighborhoods' is a variable set in uhflist.js
        const match = neighborhoods.find(
            n => n.UHF_id == geocodeClicked
        );
        
        // console.log('neighborhoods:', neighborhoods)
        
        if (match && match.page_name) {

            // Report destination: a topic button's choice on the NR landing page, or the
            // topic already being read. Null on a neighborhood index, which has neither.
            const dest = intendedDestinationName || chosenReport;

            // Neighborhood-first URLs. Both shapes are pages the content adapter generates,
            // so the slug travels in the path — there is no sessionStorage hand-off left to
            // make, and no clean topic URL that would read one.
            const buildURL = dest
                ? {{ relURL "neighborhood-reports/" }} + match.page_name + '/' + dest + '/'
                : {{ relURL "neighborhood-reports/" }} + match.page_name + '/';

            // Redirect - send to new page
            window.location.href = buildURL;
            // console.log(buildURL)

        } else {
            console.warn("No matching neighborhood for GEOCODE:", geocodeClicked);
        }
    }
    
    
</script>

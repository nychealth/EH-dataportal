<div class="row justify-content-center">
  <div class="col-2"></div>
  <div class="col-10">
    <div id="cpVis2" style="width: 100%"></div>
    <h3 class="h4 cp-sticky-header cp-sticky-only">
      Air pollution inside of the CRZ
    </h3>
    <div class="row py-2 border-top">
      <div class="col-5 border-right"></div>
      <div class="col-7">
        {{- with .Resources.GetMatch "aq-inside-crz.md" -}} {{ .Content }} {{-
        end -}}
        <div class="row mt-1"></div>
      </div>
    </div>
  </div>

  <script>
    const CP_CONTAINER2_ID = "cpVis2";

    const baseSpec_1 = {
      $schema: "https://vega.github.io/schema/vega-lite/v5.json",
      config: {
        header: {
          labelAlign: "left",
          labelAnchor: "start",
          labelFont: "Helvetica",
          labelFontWeight: "bold",
          labelFontSize: 12,
        },
        view: { stroke: null },
        axisX: { labelAngle: 0, domain: true, grid: false },
        axisY: { domain: false, ticks: false, title: null },
      },
      data: {
        url: "https://gist.githubusercontent.com/jgoldsmith-nyc/ae50455071bbe585f5b756e8af1e0146/raw/a40e6427e51f4d457e658ab1c6885b71ebdb3911/Q3_2025_regional_tables.csv",
      },
      resolve: { scale: { x: "independent", y: "independent" } },
      facet: { field: "Parameter", title: null },
      spec: {
        width: 180,
        height: { step: 22 },
        encoding: {
          y: {
            field: "Site Name",
            type: "nominal",
            title: null,
            axis: { labelLimit: 160 },
          },
        },
        layer: [
          {
            mark: {
              type: "rule",
              color: "lightgray",
              strokeWidth: 4,
              strokeCap: "round",
            },
            encoding: {
              x: {
                field: "HistoricalMin",
                type: "quantitative",
                title: "Historical range  /  Q3 2025",
              },
              x2: { field: "HistoricalMax" },
            },
          },
          {
            mark: { type: "point", filled: true, size: 80 },
            encoding: {
              x: { field: "Arithmetic Mean", type: "quantitative", title: "" },
              color: {
                field: "State",
                type: "nominal",
                legend: { title: null, orient: "top" },
                scale: {
                  domain: ["New York", "New Jersey", "Connecticut"],
                  range: ["#2b6cb0", "#276749", "#9b2c2c"],
                },
              },
              tooltip: [
                { field: "Site Name", type: "nominal", title: "Site" },
                { field: "State", type: "nominal", title: "State" },
                {
                  field: "Arithmetic Mean",
                  type: "quantitative",
                  title: "Q3 2025",
                  format: ".3f",
                },
                {
                  field: "HistoricalMin",
                  type: "quantitative",
                  title: "Historical min",
                  format: ".3f",
                },
                {
                  field: "HistoricalMax",
                  type: "quantitative",
                  title: "Historical max",
                  format: ".3f",
                },
              ],
            },
          },
        ],
      },
      columns: 3,
    };

    async function draw_crz() {
      const el = document.getElementById(CP_CONTAINER2_ID);
      if (!el) return;

      el.innerHTML = "";

      try {
        await vegaEmbed(el, baseSpec_1, {
          actions: false,
          renderer: "canvas",
        });
      } catch (err) {
        console.error("CP Vega render failed:", err);
        el.innerHTML =
          "<pre style='white-space:pre-wrap'>Chart failed to render. See console.</pre>";
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      if (typeof vegaEmbed !== "function") {
        console.error(
          "vegaEmbed not available. Are the Vega scripts loaded above this script?",
        );
        return;
      }

      await draw_crz();
    });
  </script>
</div>

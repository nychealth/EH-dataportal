<div class="row">
  <div class="col-12 d-flex">
    <div
      id="cpSiteButtons2"
      class="btn-group btn-block flex-wrap"
      role="group"z
      aria-label="Choose site"
    ></div>
  </div>
</div>

  <div class="row">
    <div class="col-12 d-flex justify-content-center">
      <div id="cpVis2" style="width: 100%;"></div>
    </div>
  </div>

  <script>
    const CP_CONTAINER2_ID = "cpVis2";

    // Buttons for sites
    const SITES = [
      "Mott Haven",
      "Cross Bronx Expwy",
      "BQE",
      "Van Wyck",
      "Staten Island",
      "FDR",
      "Hamilton Bridge",
    ];

    // Default selection
    let currentSite_1 = "Mott Haven";

    // Base spec
    const baseSpec_1 = {
      $schema: "https://vega.github.io/schema/vega-lite/v6.json",
      config: {
        header: {
          labelAlign: "left",
          labelAnchor: "start",
          labelFont: "Helvetica",
          labelFontWeight: "bold",
          labelFontSize: 12,
        },
        view: { stroke: null },
        axisX: { labelAngle: 0, domain: false },
        axisY: {
          domain: false,
          ticks: false,
          tickCount: 3,
          orient: "left",
          title: null,
        },
      },
      data: {
        url: "https://gist.githubusercontent.com/mmontesanonyc/c4a858aba1959c377188e9c2dbb50681/raw/2d439386e74ce7dbbb0b31bac8cc736f28d18114/cp-test-data-with-units.csv",
      },
      resolve: { scale: { y: "independent" } },
      transform: [
        { filter: "datum.Site === 'Mott Haven'" },
        {
          calculate: "datum.Parameter + ' (' + datum.Unit + ')'",
          as: "ParameterWithUnit",
        },
        { calculate: "datum.Average + ' ' + datum.Unit", as: "ValueWithUnit" },
        { calculate: "datum.LC + ', ' + datum.UC", as: "ciRange" },
        {
          calculate:
            "datum.Time === 'Pre' ? 'Before congestion pricing' : datum.Time === 'Post' ? 'With congestion pricing' : datum.Time",
          as: "TimeLabel",
        },
      ],
      facet: { field: "ParameterWithUnit", title: null },
      spec: {
        width: 150,
        height: 250,
        encoding: {
          x: {
            field: "Time",
            type: "nominal",
            sort: "descending",
            title: null,
          },
        },
        layer: [
          {
            mark: {
              type: "rule",
              strokeWidth: 5,
              color: "lightgray",
              strokeCap: "round",
            },
            encoding: {
              y: { field: "UC", type: "quantitative" },
              y2: { field: "LC", type: "quantitative" },
            },
          },
          {
            mark: { type: "line", color: "blue", strokeDash: [2, 2] },
            encoding: { y: { field: "Average", type: "quantitative" } },
          },
          {
            mark: { type: "circle", size: 100, color: "blue" },
            encoding: {
              y: {
                field: "Average",
                type: "quantitative",
                scale: { domainMin: 0, nice: false },
              },
              tooltip: [
                { field: "Parameter", type: "nominal", title: "Pollutant" },
                { field: "TimeLabel", type: "nominal", title: "Period" },
                { field: "ValueWithUnit", type: "nominal", title: "Average" },
                {
                  field: "ciRange",
                  type: "nominal",
                  title: "Confidence interval",
                },
              ],
            },
          },
        ],
      },
      columns: 5,
    };

    function specForSite(site) {
      // structuredClone first; fallback to JSON clone
      const spec =
        typeof structuredClone === "function"
          ? structuredClone(baseSpec_1)
          : JSON.parse(JSON.stringify(baseSpec_1));

      spec.transform[0].filter = `datum.Site === '${site}'`;
      return spec;
    }

    async function draw(site) {
      const el = document.getElementById(CP_CONTAINER2_ID);
      if (!el) return;

      el.innerHTML = ""; // clear previous render

      try {
        await vegaEmbed(el, specForSite_1(site), {
          actions: false,
          renderer: "canvas",
        });
      } catch (err) {
        console.error("CP Vega render failed:", err);
        el.innerHTML =
          "<pre style='white-space:pre-wrap'>Chart failed to render. See console.</pre>";
      }
    }

    function renderButtons() {
      const btnWrap = document.getElementById("cpSiteButtons2");
      if (!btnWrap) return;

      btnWrap.innerHTML = "";

      SITES.forEach((site) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn btn-sm btn-outline-dark m-1";
        btn.textContent = site;

        if (site === currentSite_1) btn.classList.add("active");

        btn.addEventListener("click", async () => {
          currentSite_1 = site;
          // toggle active state
          [...btnWrap.querySelectorAll("button")].forEach((b) =>
            b.classList.remove("active")
          );
          btn.classList.add("active");

          await draw(site);
        });

        btnWrap.appendChild(btn);
      });
    }

    document.addEventListener("DOMContentLoaded", async () => {
      if (typeof vegaEmbed !== "function") {
        console.error(
          "vegaEmbed not available. Are the Vega scripts loaded above this script?"
        );
        return;
      }

      renderButtons();
      await draw(currentSite_1);
    });

    const cpSpec = {
      $schema: "https://vega.github.io/schema/vega-lite/v6.json",
      config: {
        header: {
          labelAlign: "left",
          labelAnchor: "start",
          labelFont: "Helvetica",
          labelFontWeight: "bold",
          labelFontSize: 12,
        },
        view: { stroke: null },
        axisX: { labelAngle: 0, domain: false },
        axisY: {
          domain: false,
          ticks: false,
          tickCount: 3,
          orient: "left",
          title: null,
        },
      },
      data: {
        url: "https://gist.githubusercontent.com/mmontesanonyc/c4a858aba1959c377188e9c2dbb50681/raw/2d439386e74ce7dbbb0b31bac8cc736f28d18114/cp-test-data-with-units.csv",
      },
      resolve: { scale: { y: "independent" } },
      transform: [
        { filter: "datum.Site === 'Mott Haven'" },
        {
          calculate: "datum.Parameter + ' (' + datum.Unit + ')'",
          as: "ParameterWithUnit",
        },
        {
          calculate: "datum.Average + ' ' + datum.Unit",
          as: "ValueWithUnit",
        },
        {
          calculate: "datum.LC + ', ' + datum.UC",
          as: "ciRange",
        },
        {
          calculate:
            "datum.Time === 'Pre' ? 'Before congestion pricing' : datum.Time === 'Post' ? 'With congestion pricing' : datum.Time",
          as: "TimeLabel",
        },
      ],
      facet: { field: "ParameterWithUnit", title: null },
      spec: {
        width: 150,
        height: 250,
        encoding: {
          x: {
            field: "Time",
            type: "nominal",
            sort: "descending",
            title: null,
          },
        },
        layer: [
          {
            mark: {
              type: "rule",
              strokeWidth: 5,
              color: "lightgray",
              strokeCap: "round",
            },
            encoding: {
              y: { field: "UC", type: "quantitative" },
              y2: { field: "LC", type: "quantitative" },
            },
          },
          {
            mark: { type: "line", color: "blue", strokeDash: [2, 2] },
            encoding: { y: { field: "Average", type: "quantitative" } },
          },
          {
            mark: { type: "circle", size: 100, color: "blue" },
            encoding: {
              y: {
                field: "Average",
                type: "quantitative",
                scale: { domainMin: 0, nice: false },
              },
              tooltip: [
                { field: "Parameter", type: "nominal", title: "Pollutant" },
                { field: "TimeLabel", type: "nominal", title: "Period" },
                { field: "ValueWithUnit", type: "nominal", title: "Average" },
                {
                  field: "ciRange",
                  type: "nominal",
                  title: "Confidence interval",
                },
              ],
            },
          },
        ],
      },
      columns: 5,
    };

    document.addEventListener("DOMContentLoaded", async () => {
      const el = document.getElementById("cpVis2");
      if (!el) return;

      try {
        await vegaEmbed(el, cpSpec, { actions: false, renderer: "canvas" });
      } catch (err) {
        console.error("CP Vega render failed:", err);
        el.innerHTML =
          "<pre style='white-space:pre-wrap'>Chart failed to render.</pre>";
      }
    });
  </script>
</div>

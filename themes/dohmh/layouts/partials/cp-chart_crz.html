      "width": 200,
      "height": {

      },
      "layer": [
        {
          "mark": {
            "type": "rule",

          }
        },
        {

              }
            },
            "stroke": {
              "condition": {
                "test": "datum['Site Name'] === 'Bayonne'",

              "value": null

              "value": 0

          }
        }
      ],
      "encoding": {
        "y": {
          "field": "StateAndSite",
          "type": "nominal",
          "title": null,
          "sort": {
            "field": "SortKey"
          },
          "scale": {
            "domain": {
              "data": "source",
              "field": "StateAndSite"
            },
            "bandPosition": 0
          },
          "axis": {
            "labelLimit": 220
          }
        }
      }
    },
    {
      "title": {
        "text": "NO2",
        "anchor": "start",
        "font": "Helvetica",
        "fontWeight": "bold",
        "fontSize": 12
      },
      "transform": [
        {
          "filter": "datum.Parameter === 'NO2'"
        }
      ],
      "width": 200,
      "height": {
        "step": 22
      },
      "layer": [
        {
          "mark": {
            "type": "rule",
            "color": "lightgray",
            "strokeWidth": 6,
            "strokeCap": "round"
          },
          "encoding": {
            "x": {
              "field": "HistoricalMin",
              "type": "quantitative",
              "title": null
            },
            "x2": {

            }
          }
        },
        {
          "mark": {
            "type": "point",
            "filled": true,
            "size": 150
          },
          "encoding": {

              "type": "quantitative",
              "title": null
            },
            "color": {
              "field": "State",
              "type": "nominal",
              "legend": null,
              "scale": {
                "domain": [
                  "New York",
                  "New Jersey",
                  "Connecticut"
                ],
                "range": [
                  "#2b6cb0",
                  "#276749",
                  "#9b2c2c"
                ]
              }
            },
            "stroke": {
              "condition": {
                "test": "datum['Site Name'] === 'Bayonne'",
                "value": "black"
              },
              "value": null
            },
            "strokeWidth": {
              "condition": {
                "test": "datum['Site Name'] === 'Bayonne'",
                "value": 0
              },
              "value": 0
            }
          }
        }
      ],
      "encoding": {
        "y": {
          "field": "StateAndSite",
          "type": "nominal",
          "title": null,
          "sort": {
            "field": "SortKey"
          },
          "scale": {
            "domain": {
              "data": "source",
              "field": "StateAndSite"
            },
            "bandPosition": 1
          },
          "axis": null
        }
      }
    },
    {
      "title": {
        "text": "Ozone",
        "anchor": "start",
        "font": "Helvetica",
        "fontWeight": "bold",
        "fontSize": 12
      },
      "transform": [
        {
          "filter": "datum.Parameter === 'Ozone'"
        }
      ],
      "width": 200,
      "height": {
        "step": 22
      },
      "layer": [
        {
          "mark": {
            "type": "rule",
            "color": "lightgray",
            "strokeWidth": 6,
            "strokeCap": "round"

            "x": {

              "condition": {

        }

  ],
  "spacing": 40
}   
  async function draw_crz() {
      const el = document.getElementById(CP_CONTAINER2_ID);
      if (!el) return;

      el.innerHTML = "";

      try {
        await vegaEmbed(el, baseSpec_1, {
          actions: true,
          renderer: "canvas",
        });
      } catch (err) {
        console.error("CP Vega render failed:", err);
        el.innerHTML =
          "<pre style='white-space:pre-wrap'>Chart failed to render. See console.</pre>";
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      if (typeof vegaEmbed !== "function") {
        console.error(
          "vegaEmbed not available. Are the Vega scripts loaded above this script?",
        );
        return;
      }

      await draw_crz();
    });
  </script>
</div>

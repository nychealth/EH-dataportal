<div class="row justify-content-center">
  <div class="col-2"></div>
  <div class="col-10">
    <div id="cpVis2" style="width: 100%;"></div>
    <h3 class="h4 cp-sticky-header cp-sticky-only">Air pollution inside of the CRZ</h3>
    <div class="row py-2 border-top">
        <div class="col-5 border-right">
            <div style="min-height:250px" id="datawrapper-vis-YFkVt"><script type="text/javascript" defer src="https://datawrapper.dwcdn.net/YFkVt/embed.js" charset="utf-8" data-target="#datawrapper-vis-YFkVt"></script><noscript><img src="https://datawrapper.dwcdn.net/YFkVt/full.png" alt="Locator map" /></noscript></div>
        </div>
        <div class="col-7">
            {{- with .Resources.GetMatch "aq-inside-crz.md" -}}
                {{ .Content }}
            {{- end -}}
            <div class="row mt-1">
                <div class="col-12 my-1">
                    <div style="min-height:109px" id="datawrapper-vis-3F9Bw"><script type="text/javascript" defer src="https://datawrapper.dwcdn.net/3F9Bw/embed.js" charset="utf-8" data-target="#datawrapper-vis-3F9Bw"></script><noscript><img src="https://datawrapper.dwcdn.net/3F9Bw/full.png" alt="Arrow Plot" /></noscript></div>
                </div>
              </div>
              <div class="row">
                <div class="col-12 my-1">
                  <div style="min-height:92px" id="datawrapper-vis-vEUVy"><script type="text/javascript" defer src="https://datawrapper.dwcdn.net/vEUVy/embed.js" charset="utf-8" data-target="#datawrapper-vis-vEUVy"></script><noscript><img src="https://datawrapper.dwcdn.net/vEUVy/full.png" alt="Arrow Plot" /></noscript></div>
                </div>
              </div>
              <div class="row">
                <div class="col-12 my-1">
                    <div style="min-height:109px" id="datawrapper-vis-3F9Bw"><script type="text/javascript" defer src="https://datawrapper.dwcdn.net/3F9Bw/embed.js" charset="utf-8" data-target="#datawrapper-vis-3F9Bw"></script><noscript><img src="https://datawrapper.dwcdn.net/3F9Bw/full.png" alt="Arrow Plot" /></noscript></div>
                </div>
            </div>
        </div>
    </div>
    
  </div>
</div>

  <script>
    const CP_CONTAINER2_ID = "cpVis2";

    const baseSpec_1 = {
      $schema: "https://vega.github.io/schema/vega-lite/v5.json",
      config: {
        header: {
          labelAlign: "left",
          labelAnchor: "start",
          labelFont: "Helvetica",
          labelFontWeight: "bold",
          labelFontSize: 12,
        },
        view: { stroke: null },
        axisX: { labelAngle: 0, domain: true, grid: false },
        axisY: { domain: false, ticks: false, title: null },
      },
      data: {
        url: "https://gist.githubusercontent.com/jgoldsmith-nyc/ae50455071bbe585f5b756e8af1e0146/raw/17a39c656c22e6060c840b080cc537211053e0b1/Q2_2025_regional_tables.csv",
      },
      resolve: { scale: { x: "independent", y: "independent" } },
      facet: { field: "Parameter", title: null },
      spec: {
        width: 180,
        height: { step: 22 },
        encoding: {
          y: {
            field: "Site Name",
            type: "nominal",
            title: null,
            axis: { labelLimit: 160 },
          },
        },
        layer: [
          {
            mark: { type: "rule", color: "lightgray", strokeWidth: 4, strokeCap: "round" },
            encoding: {
              x: { field: "HistoricalMin", type: "quantitative", title: "Historical range  /  Q2 2025" },
              x2: { field: "HistoricalMax" },
            },
          },
          {
            mark: { type: "point", filled: true, size: 80 },
            encoding: {
              x: { field: "Arithmetic Mean", type: "quantitative", title: "" },
              color: {
                field: "State",
                type: "nominal",
                legend: { title: null, orient: "top" },
                scale: {
                  domain: ["New York", "New Jersey", "Connecticut"],
                  range: ["#2b6cb0", "#276749", "#9b2c2c"],
                },
              },
              tooltip: [
                { field: "Site Name", type: "nominal", title: "Site" },
                { field: "State", type: "nominal", title: "State" },
                { field: "Arithmetic Mean", type: "quantitative", title: "Q2 2025", format: ".3f" },
                { field: "HistoricalMin", type: "quantitative", title: "Historical min", format: ".3f" },
                { field: "HistoricalMax", type: "quantitative", title: "Historical max", format: ".3f" },
              ],
            },
          },
        ],
      },
      columns: 3,
    };

    async function draw_crz() {
      const el = document.getElementById(CP_CONTAINER2_ID);
      if (!el) return;

      el.innerHTML = "";

      try {
        await vegaEmbed(el, baseSpec_1, {
          actions: false,
          renderer: "canvas",
        });
      } catch (err) {
        console.error("CP Vega render failed:", err);
        el.innerHTML =
          "<pre style='white-space:pre-wrap'>Chart failed to render. See console.</pre>";
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      if (typeof vegaEmbed !== "function") {
        console.error("vegaEmbed not available. Are the Vega scripts loaded above this script?");
        return;
      }

      await draw_crz();
    });

  </script>
</div>

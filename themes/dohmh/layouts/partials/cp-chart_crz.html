  <div class="col-10">
    <div id="cpVis2" style="width: 100%;"></div>
    <h3 class="h4 cp-sticky-header cp-sticky-only">Air pollution inside of the CRZ</h3>
    <div class="row py-2 border-top">
        <div class="col-5 border-right">
            <div style="min-height:250px" id="datawrapper-vis-YFkVt"><script type="text/javascript" defer src="https://datawrapper.dwcdn.net/YFkVt/embed.js" charset="utf-8" data-target="#datawrapper-vis-YFkVt"></script><noscript><img src="https://datawrapper.dwcdn.net/YFkVt/full.png" alt="Locator map" /></noscript></div>

            {{- with .Resources.GetMatch "aq-inside-crz.md" -}}
                {{ .Content }}
            {{- end -}}
            <div class="row mt-1">
                <div class="col-12 my-1">
                    <div style="min-height:109px" id="datawrapper-vis-3F9Bw"><script type="text/javascript" defer src="https://datawrapper.dwcdn.net/3F9Bw/embed.js" charset="utf-8" data-target="#datawrapper-vis-3F9Bw"></script><noscript><img src="https://datawrapper.dwcdn.net/3F9Bw/full.png" alt="Arrow Plot" /></noscript></div>
                </div>

              <div class="row">
                <div class="col-12 my-1">
                  <div style="min-height:92px" id="datawrapper-vis-vEUVy"><script type="text/javascript" defer src="https://datawrapper.dwcdn.net/vEUVy/embed.js" charset="utf-8" data-target="#datawrapper-vis-vEUVy"></script><noscript><img src="https://datawrapper.dwcdn.net/vEUVy/full.png" alt="Arrow Plot" /></noscript></div>
                </div>
              </div>
              <div class="row">
                <div class="col-12 my-1">
                    <div style="min-height:109px" id="datawrapper-vis-3F9Bw"><script type="text/javascript" defer src="https://datawrapper.dwcdn.net/3F9Bw/embed.js" charset="utf-8" data-target="#datawrapper-vis-3F9Bw"></script><noscript><img src="https://datawrapper.dwcdn.net/3F9Bw/full.png" alt="Arrow Plot" /></noscript></div>
                </div>
            </div>
        </div>

  </div>
</div>

  <style>
    .vega-embed {
        height: 200px !important;
    }
</style>

  <script>
    const CP_CONTAINER2_ID = "cpVis2";

    // Buttons for sites
    const SITES2 = [
      "Mott Haven",
      "Cross Bronx Expwy",
      "BQE",
      "Van Wyck",
      "Staten Island",
      "FDR",
      "Hamilton Bridge",
    ];

    // Default selection
    let currentSite_1 = "Mott Haven";

    // Base spec
    const baseSpec_1 = {
      $schema: "https://vega.github.io/schema/vega-lite/v6.json",
      config: {
        header: {
          labelAlign: "left",
          labelAnchor: "start",
          labelFont: "Helvetica",
          labelFontWeight: "bold",
          labelFontSize: 12,
        },
        view: { stroke: null },
        axisX: { labelAngle: 0, domain: false },
        axisY: {
          domain: false,
          ticks: false,
          tickCount: 3,
          orient: "left",
          title: null,
        },
      },
      data: {
        url: "https://gist.githubusercontent.com/mmontesanonyc/c4a858aba1959c377188e9c2dbb50681/raw/2d439386e74ce7dbbb0b31bac8cc736f28d18114/cp-test-data-with-units.csv",
      },
      resolve: { scale: { y: "independent" } },
      transform: [
        { filter: "datum.Site === 'Mott Haven'" },
        {
          calculate: "datum.Parameter + ' (' + datum.Unit + ')'",
          as: "ParameterWithUnit",
        },
        { calculate: "datum.Average + ' ' + datum.Unit", as: "ValueWithUnit" },
        { calculate: "datum.LC + ', ' + datum.UC", as: "ciRange" },
        {
          calculate:
            "datum.Time === 'Pre' ? 'Before congestion pricing' : datum.Time === 'Post' ? 'With congestion pricing' : datum.Time",
          as: "TimeLabel",
        },
      ],
      facet: { field: "ParameterWithUnit", title: null },
      spec: {
        width: 150,
        height: 250,
        encoding: {
          x: {
            field: "Time",
            type: "nominal",
            sort: "descending",
            title: null,
          },
        },
        layer: [
          {
            mark: {
              type: "rule",
              strokeWidth: 5,
              color: "lightgray",
              strokeCap: "round",
            },
            encoding: {
              y: { field: "UC", type: "quantitative" },
              y2: { field: "LC", type: "quantitative" },
            },
          },
          {
            mark: { type: "line", color: "blue", strokeDash: [2, 2] },
            encoding: { y: { field: "Average", type: "quantitative" } },
          },
          {
            mark: { type: "circle", size: 100, color: "blue" },
            encoding: {
              y: {
                field: "Average",
                type: "quantitative",
                scale: { domainMin: 0, nice: false },
              },
              tooltip: [
                { field: "Parameter", type: "nominal", title: "Pollutant" },
                { field: "TimeLabel", type: "nominal", title: "Period" },
                { field: "ValueWithUnit", type: "nominal", title: "Average" },
                {
                  field: "ciRange",
                  type: "nominal",
                  title: "Confidence interval",
                },
              ],
            },
          },
        ],
      },
      columns: 5,
    };

    function specForSite1(site) {
      // structuredClone first; fallback to JSON clone
      const spec1 =
        typeof structuredClone === "function"
          ? structuredClone(baseSpec_1)
          : JSON.parse(JSON.stringify(baseSpec_1));

      spec1.transform[0].filter = `datum.Site === '${site}'`;
      return spec1;
    }

    async function draw_crz(site) {
      const el = document.getElementById(CP_CONTAINER2_ID);
      if (!el) return;

      el.innerHTML = ""; // clear previous render

      try {
        await vegaEmbed(el, specForSite1(site), {
          actions: false,
          renderer: "canvas",
        });
      } catch (err) {
        console.error("CP Vega render failed:", err);
        el.innerHTML =
          "<pre style='white-space:pre-wrap'>Chart failed to render. See console.</pre>";
      }
    }

    function renderButtons_crz() {
      const btnWrap1 = document.getElementById("cpSiteButtons2");
      if (!btnWrap1) return;

      btnWrap1.innerHTML = "";

      SITES2.forEach((site) => {
        const btn1 = document.createElement("button");
        btn1.type = "button";
        btn1.className = "btn btn-sm btn-outline-dark";
        btn1.textContent = site;

        if (site === currentSite_1) btn1.classList.add("active");

        btn1.addEventListener("click", async () => {
          currentSite_1 = site;
          // toggle active state
          [...btnWrap1.querySelectorAll("button")].forEach((b) =>
            b.classList.remove("active")
          );
          btn1.classList.add("active");

          await draw_crz(site);
        });

        btnWrap1.appendChild(btn1);
      });
    }

    document.addEventListener("DOMContentLoaded", async () => {
      if (typeof vegaEmbed !== "function") {
        console.error(
          "vegaEmbed not available. Are the Vega scripts loaded above this script?"
        );
        return;
      }

      renderButtons_crz();
      await draw_crz(currentSite_1);
    });

    const cpSpec1 = {
      $schema: "https://vega.github.io/schema/vega-lite/v6.json",
      config: {
        header: {
          labelAlign: "left",
          labelAnchor: "start",
          labelFont: "Helvetica",
          labelFontWeight: "bold",
          labelFontSize: 12,
        },
        view: { stroke: null },
        axisX: { labelAngle: 0, domain: false },
        axisY: {
          domain: false,
          ticks: false,
          tickCount: 3,
          orient: "left",
          title: null,
        },
      },
      data: {
        url: "https://gist.githubusercontent.com/mmontesanonyc/c4a858aba1959c377188e9c2dbb50681/raw/2d439386e74ce7dbbb0b31bac8cc736f28d18114/cp-test-data-with-units.csv",
      },
      resolve: { scale: { y: "independent" } },
      transform: [
        { filter: "datum.Site === 'Mott Haven'" },
        {
          calculate: "datum.Parameter + ' (' + datum.Unit + ')'",
          as: "ParameterWithUnit",
        },
        {
          calculate: "datum.Average + ' ' + datum.Unit",
          as: "ValueWithUnit",
        },
        {
          calculate: "datum.LC + ', ' + datum.UC",
          as: "ciRange",
        },
        {
          calculate:
            "datum.Time === 'Pre' ? 'Before congestion pricing' : datum.Time === 'Post' ? 'With congestion pricing' : datum.Time",
          as: "TimeLabel",
        },
      ],
      facet: { field: "ParameterWithUnit", title: null },
      spec: {
        width: 150,
        height: 250,
        encoding: {
          x: {
            field: "Time",
            type: "nominal",
            sort: "descending",
            title: null,
          },
        },
        layer: [
          {
            mark: {
              type: "rule",
              strokeWidth: 5,
              color: "lightgray",
              strokeCap: "round",
            },
            encoding: {
              y: { field: "UC", type: "quantitative" },
              y2: { field: "LC", type: "quantitative" },
            },
          },
          {
            mark: { type: "line", color: "blue", strokeDash: [2, 2] },
            encoding: { y: { field: "Average", type: "quantitative" } },
          },
          {
            mark: { type: "circle", size: 100, color: "blue" },
            encoding: {
              y: {
                field: "Average",
                type: "quantitative",
                scale: { domainMin: 0, nice: false },
              },
              tooltip: [
                { field: "Parameter", type: "nominal", title: "Pollutant" },
                { field: "TimeLabel", type: "nominal", title: "Period" },
                { field: "ValueWithUnit", type: "nominal", title: "Average" },
                {
                  field: "ciRange",
                  type: "nominal",
                  title: "Confidence interval",
                },
              ],
            },
          },
        ],
      },
      columns: 5,
    };

    document.addEventListener("DOMContentLoaded", async () => {
      const el = document.getElementById("cpVis2");
      if (!el) return;

      try {
        await vegaEmbed(el, cpSpec1, { actions: false, renderer: "canvas" });
      } catch (err) {
        console.error("CP Vega render failed:", err);
        el.innerHTML =
          "<pre style='white-space:pre-wrap'>Chart failed to render.</pre>";
      }
    });
  </script>
</div>

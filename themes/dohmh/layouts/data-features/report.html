{{- define "main" -}}

<style>
    thead, th, td {
        padding: 2px 25px;
        border-bottom: 1px solid lightgray;
      }
      
      h2, h3, h4 {
        margin-top: 40px;
      }
</style>

<article class="container-fluid" id="skip-header-target">

    <div class="row">

    {{ $weight := "" }}

    {{ with .Params.content_weight }}
        {{ $weight = . }}
    {{ end }}

        <div class="col-md-8 col-sm-12 mx-auto mb-6" data-pagefind-weight="{{ $weight }}">
            <div class="row">
                <div class="col-12 mx-auto mt-2 mb-3">
                    <nav aria-label="breadcrumb">
                        <ul class="breadcrumb">
                            <li class="breadcrumb-item"><a href={{ relURL "" }}>Home</a></li>
                            <li class="breadcrumb-item"><a href={{ relURL "data-features" }}>Data Features</a></li>
        
                            <li class="breadcrumb-item active" aria-current="page">{{ .Title }}</li>
                        </ul>
                    </nav>
                </div>
            </div>

                <h1 class="h2" data-pagefind-weight="10.0">
                    {{ .Title }}
                </h1>

                {{- .Content  -}}

        </div>

    </div>

<!-- Modal for correction on 2023 Heat Mort Report --> 
{{ if .Params.modal }}
    {{ partial "heat-report-correction" . }}
{{ end }}

</article>

{{- if .Params.js -}}
    <script src="{{ .Params.js }}"></script>
{{- end -}}

{{- end -}}

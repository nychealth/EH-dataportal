{{- define "main" -}}

<style>
  .combo-cell {
  padding: 6px 0;
}

.combo-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;            
  border-bottom: 1px solid #ddd;
}

.combo-row:last-child {
  border-bottom: none; 
}

.combo-label {
  font-size: 0.85rem;
  color: #303030;
  margin-right: 10px;
}

.combo-value {
  font-weight: 700;           
  font-size: 0.95rem;
  color: #000;
  text-align: right;
  white-space: nowrap;
}

</style>

<article id="skip-header-target">
    <div class="container-fluid" data-pagefind-weight="0">
        <div class="row">
            <div class="col-sm-12 mt-2 mb-2">
                <nav aria-label="breadcrumb" class="">
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href={{ relURL "" }}>Home</a></li>
                        <li class="breadcrumb-item"><a href='../'>Resources</a></li>
                        <li class="breadcrumb-item active" aria-current="page">{{ .Title }}</li>
                    </ul>
                </nav>
            </div>
        </div>

        <div class="row mt-1 py-4 mb-4 border-bottom">
            <div class="col-12 mb-3">
                <div class="key-topics">
                    <h1 class="h2">{{ .Title }}</h1>
                </div>
            </div>

            <div class="col-md-12">
                {{- .Content -}}

                <hr>

                <!-- Filter + Search Row -->
                <div class="row mb-3 pt-2">

                    <!-- BRAND FILTER (50%) -->
                    <div class="col-md-6">
                        <label class="mb-1 font-weight-bold" for="brandFilter">Filter</label>
                        <div class="d-flex">
                            <select id="brandFilter" class="form-control form-control-sm flex-grow-1">
                                <option value="">All Brands</option>
                            </select>
                            <button id="clearBrandFilter" class="btn btn-sm btn-secondary">Clear</button>
                        </div>
                    </div>

                    <!-- SEARCH (50%) -->
                    <div class="col-md-6">
                        <label class="mb-1 font-weight-bold">Search</label>
                        <div id="searchContainer"></div>
                    </div>

                </div>

                <!-- Table -->
                <div id="fullSugarTableContainer" class="my-4">
                    <table id="fullSugarTable" class="table table-striped table-bordered table-sm fs-sm" style="width:100%;overflow-x: auto;">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>

            </div>

        </div>

    </div>

</article>

{{- partial "lib-d3.html" . }}
{{- partial "lib-datatables.html" . }}

<script>
let sugarData = [];

d3.csv("sugar-items-data.csv").then(function(data) {
  sugarData = data;
  renderFullSugarTable();
});

function renderFullSugarTable() {
  if (!sugarData || sugarData.length === 0) return;

  const columns = Object.keys(sugarData[0]); // 5 CSV columns

  // ---- HEADER: add 6th combined column ----
  $("#fullSugarTable thead").empty().append(
    $("<tr>").append([
      ...columns.map(c => $("<th>").text(c)),
      $("<th>").text("Sugar info")  // NEW COLUMN HEADER
    ])
  );

  // ---- BODY: add 6th placeholder cell ----
  const tbody = $("#fullSugarTable tbody").empty();
  sugarData.forEach(row => {
    const tr = $("<tr>");

    // original 5 CSV columns
    columns.forEach(col => {
      tr.append($("<td>").text(row[col]));
    });

    // empty TD for DataTables to fill
    tr.append($("<td>"));

    tbody.append(tr);
  });

  // Identify numeric columns for right-alignment
  const numericCols = columns
    .map((c, i) => ({ index: i, sample: sugarData[0][c] }))
    .filter(col => !isNaN(parseFloat(col.sample)));

  // ---- DATATABLE INIT ----
  const table = $("#fullSugarTable").DataTable({
    paging: true,
    searching: true,
    pageLength: 25,
    lengthChange: false,
    ordering: false,
    autoWidth: false,
    destroy: true,

    columnDefs: [
      {
        targets: 0,         // first column
        render: function (data, type, row) {
          const original = row[0]; // text from CSV

          return `
            <span class="fs-rg font-weight-bold">${original}</span>
          `;
        }
      },

      {
        targets: 1,         // first column
        render: function (data, type, row) {
          const original = row[1]; // text from CSV

          return `
            <span class="fs-sm font-weight-bold">${original}</span>
          `;
        }
      },

      // Hide original columns 3, 4, 5 (0-based indices: 2, 3, 4)
      { targets: [2, 3, 4], visible: false },

      // ---- Combined HTML column (index 5) ----
      {
        targets: 5,
        data: null,
        render: function (data, type, row) {
          const c3 = row[2]; // 3rd CSV column
          const c4 = row[3]; // 4th CSV column
          const c5 = row[4]; // 5th CSV column

          return `
            <div class="combo-cell">
              <div class="combo-row">
                <span class="combo-label">NFL: Added Sugars:</span>
                <span class="combo-value">${c5}</span>
              </div>

              <div class="combo-row">
                <span class="combo-label">NFL: Calories:</span>
                <span class="combo-value">${c4}</span>
              </div>

              <div class="combo-row">
                <span class="combo-label">Calories needed for 50g of added sugar:</span>
                <span class="combo-value">${c3}</span>
              </div>
            </div>
          `;
        }
      }
    ]
  });

  // ---- MOVE SEARCH BOX ----
  const dtFilter = $("#fullSugarTable_filter");
  $("#searchContainer").append(dtFilter);

  const label = dtFilter.find("label");
  const input = label.find("input");

  dtFilter.empty();
  input.appendTo(dtFilter);
  input.addClass("form-control form-control-sm w-100");

  input.on("input", function () {
    table.search(this.value).draw();
  });

  // ---- POPULATE BRAND DROPDOWN ----
  const brandFilter = $("#brandFilter");

  sugarData.forEach(d => d["Brand Name"] = d["Brand Name"].trim());
  const uniqueBrands = [...new Set(sugarData.map(d => d["Brand Name"]))].sort();

  uniqueBrands.forEach(b => brandFilter.append(`<option value="${b}">${b}</option>`));

  brandFilter.on("change", function() {
    const val = $(this).val();
    table.column(columns.indexOf("Brand Name"))
        .search(val || "", true, false) // exact match false
        .draw();
  });


  $("#clearBrandFilter").on("click", function() {
    brandFilter.val("");
    table.column(columns.indexOf("Brand Name")).search("").draw();
  });
}
</script>


{{- end -}}

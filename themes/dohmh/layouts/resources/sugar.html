{{- define "main" -}}

<article id="skip-header-target">
    <div class="container-fluid" data-pagefind-weight="0">
        <div class="row">
            <div class="col-sm-12 mt-2 mb-2">
                <nav aria-label="breadcrumb" class="">
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href={{ relURL "" }}>Home</a></li>
                        <li class="breadcrumb-item"><a href='../'>Resources</a></li>
                        <li class="breadcrumb-item active" aria-current="page">{{ .Title }}</li>
                    </ul>
                </nav>
            </div>
        </div>

        <div class="row mt-1 py-4 mb-4 border-bottom">
            <div class="col-12 mb-3">
                <div class="key-topics">
                    <h1 class="h2">
                        {{ .Title }}
                    </h1>
                </div>
            </div>

            <div class="col-md-12">
                {{- .Content -}}

                <hr>

                <!-- Container for the DataTables table -->
                <div id="brandFilterContainer" class="mb-2">
                <label for="brandFilter">Filter by Brand:</label>
                <select id="brandFilter">
                    <option value="">All Brands</option>
                </select>
                </div>

                <div id="fullSugarTableContainer" class="my-4">
                <table id="fullSugarTable" class="table table-striped table-bordered table-sm" style="width:100%">
                    <thead></thead>
                    <tbody></tbody>
                </table>
                </div>


            </div>

        </div>

    </div>

</article>

<script>
let sugarData = [];

d3.csv("sugar-items.csv").then(function(data) {
  sugarData = data;
  renderFullSugarTable();
});

function renderFullSugarTable() {
  if (!sugarData || sugarData.length === 0) return;

  const columns = Object.keys(sugarData[0]);

  // Populate table header
  const thead = $("#fullSugarTable thead");
  thead.empty();
  const headerRow = $("<tr>");
  columns.forEach(col => headerRow.append($("<th>").text(col)));
  thead.append(headerRow);

  // Populate table body
  const tbody = $("#fullSugarTable tbody");
  tbody.empty();
  sugarData.forEach(row => {
    const tr = $("<tr>");
    columns.forEach(col => tr.append($("<td>").text(row[col])));
    tbody.append(tr);
  });

  // Initialize DataTable
  const table = $("#fullSugarTable").DataTable({
    paging: true,
    searching: true,
    pageLength: 25,
    lengthChange: false,
    ordering: true,
    autoWidth: false,
    destroy: true,
    columnDefs: [
      { targets: ["Brand Name", "Item Name"].map(c => columns.indexOf(c)), orderable: false }
    ]
  });

  // Populate Brand Filter dropdown above table
  const brandFilter = $("#brandFilter");
  const uniqueBrands = [...new Set(sugarData.map(d => d["Brand Name"]))].sort();
  uniqueBrands.forEach(b => brandFilter.append(`<option value="${b}">${b}</option>`));

  // Wire dropdown change to filter the DataTable
  brandFilter.on("change", function() {
    const val = $.fn.dataTable.util.escapeRegex($(this).val());
    table.column(columns.indexOf("Brand Name"))
      .search(val ? "^" + val + "$" : "", true, false)
      .draw();
  });
}
</script>


{{- end -}}

{{- define "main" -}}

<article id="skip-header-target">
    <div class="container wide" data-pagefind-weight="0">
        <div class="row">
            <div class="col-sm-12 mt-2 mb-2">
                <nav aria-label="breadcrumb" class="">
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href={{ relURL "" }}>Home</a></li>
                        <li class="breadcrumb-item active" aria-current="page">{{ .Title }}</li>
                    </ul>
                </nav>
            </div>
        </div>

        <div class="row mt-1 py-4 mb-4 border-bottom">
            <div class="col-12 mb-3">
                <div class="key-topics">
                    <h1 class="h2">
                        {{ .Title }}
                    </h1>
                </div>
            </div>

            <div class="col-md-12 col-lg-8 pr-xl-4">
                {{- .Content -}}

                <ul class="nav nav-tabs mb-3" id="pills-tab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="pills-home-tab" data-toggle="pill" data-target="#pills-home" type="button" role="tab" aria-controls="pills-home" aria-selected="true">Browse</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="pills-profile-tab" data-toggle="pill" data-target="#pills-profile" type="button" role="tab" aria-controls="pills-profile" aria-selected="false">Search</button>
                    </li>
                    </ul>
                    <div class="tab-content" id="pills-tabContent">
                    <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab">
                        Browse sections
                    </div>
                    <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab">
                        Search (DW table)
                    </div>
                </div>
            </div>



        </div>

    </div>

</article>

{{- end -}}

# Climate and Active Design — indicator spec for the NDHR report page.
#
# The NDHR analogue of data/globals/NR_content/*.yml, and it keeps that file's key
# naming — `MeasureID`, `IndicatorID`, `MeasureName`, spelled as EHDP-data spells
# them. NDHR forks the NR presentation (DECIDED-5) and the NR templates are the ones
# already known to work, so the data they read keeps its form where it can.
#
# NO `report_topics` LAYER, which is the one place it departs. NR_content groups its
# MeasureIDs into named subsections; neither NDHR source document groups indicators
# below the five categories, so that layer would hold exactly one group per file with
# a name nobody wrote. A flat `measures` list instead. If real subsections are ever
# authored, this becomes a list of them and the renderer gains a heading level.
#
# Four fields NR_content does not carry, each deliberate:
#
#   - `IndicatorName`, EHDP-data's own name for the indicator, spelled exactly as
#     metadata.json spells it. It is a COPY, and the copy exists for one reader:
#     ndhr-category-index.html renders it server-side, where Hugo has no access to
#     metadata.json. The report page does NOT read it — cards.js takes the headline
#     from the row buildRows produces, live from metadata — so the only way the two
#     could disagree is drift, which `node scripts/ndhr-indicator-availability.mjs
#     check` fails on. An earlier `indicator_short_name` held a site-authored short
#     form here ("Crowding", "Air conditioning"); the user chose the data repo's
#     names on 2026-09-13, so that field is gone rather than renamed.
#   - `description`, the indicator description written for THIS tool, from the
#     "Text of ..." document's second column. EHDP-data's own IndicatorDescription is
#     methodological and this one is written for a reader deciding what to build;
#     DECIDED-11 chose the document's. `null` for any row the document does not cover
#     — only evictions (1128) — which falls back to EHDP-data's. The key is required
#     even when null, so a deliberate gap is distinguishable from an oversight.
#   - `geotype`, the geography the value is READ AT. NR needs no such field because
#     every NR row is UHF42; NDHR reads three rows at PUMA2020 and two at CDTA2020
#     (DECIDED-10), and several of these measures publish at more than one geography,
#     so it cannot be implicit
#   - `strategy` and `strategy_description`, site-owned content with no EHDP-data
#     equivalent
#
# `MeasureID` is the join key, as in NR_content: MeasureIDs are unique across the
# whole of EHDP-data and name exactly one series, where an IndicatorID names a family
# of them ("Number", "Percent", "Age-adjusted rate") whose values are not
# interchangeable. `IndicatorID` rides alongside because it is what locates the
# file — EHDP-data publishes indicators/data/<IndicatorID>.json and MeasureID is a
# column inside it — so the pair is two different jobs, not a duplication.
#
# `MeasureName` is the exact EHDP-data name. It is here so an author editing strategy
# text can see which series they are on, and it is checked rather than decorative:
# `node scripts/ndhr-indicator-availability.mjs check` fails when the measure does not
# sit under the declared indicator, when the name disagrees, or when the measure does
# not publish at the declared geotype.
#
# Strategy text is from "Text of Neighborhood Development Health Report Tool for
# Revi.docx", section "Strategies and Strategy Description", tracked changes
# accepted.
#
# Not listed here, and deliberately: walking distance to a subway station (2391) and
# walkability index (2133) are UHF42-only, and households using electric medical
# equipment (2377) has no PUMA2020 data. See DECIDED-1 and DECIDED-10.

measures:

  - MeasureID: 1224
    IndicatorID: 2388
    MeasureName: "Park access, Percent"
    IndicatorName: "Walking distance to a park"
    geotype: CD
    description: "Nearby green spaces make it easier for residents to walk daily, which can lower risks of obesity chronic diseases such as diabetes, heart disease, anxiety, and depression."
    strategy: "Increase presence of parks or green spaces"
    strategy_description: "Plans such as the Walk to a Park Initiative from the Parks Department seek to increase access to parks and greenspaces, including by partnering with public and private institutions."

  - MeasureID: 822
    IndicatorID: 2191
    MeasureName: "Heat Vulnerability Index, Score"
    IndicatorName: "Heat vulnerability index"
    geotype: CDTA2020
    description: "The Heat Vulnerability Index identifies communities whose residents are more at risk for dying from extreme heat based on neighborhood-level environmental and social factors, including income, race, surface temperature, air conditioning access, and green space."
    strategy: "Increase shade, vegetation, or reflective surfaces to combat heat vulnerability"
    strategy_description: "Combating individual exposure to heat requires access to air conditioning. On the community level, the Climate Resilience Design Guidelines recommend increasing shading, vegetation, and/or high solar reflected surfaces of spaces to decrease heat vulnerability."

  # The with-AC framing, matching what the NR Climate report already shows (781).
  # 1045 is the same data stated as households WITHOUT air conditioning, which
  # would invert the tertile reading against every other row on the page.
  - MeasureID: 781
    IndicatorID: 2185
    MeasureName: "Households with AC, Percent (with AC)"
    IndicatorName: "Household air conditioning"
    geotype: PUMA2020
    description: "Access to cooling at home reduces the risk of heat-related illness and death during hot weather."
    strategy: "Increase access to cooling"
    strategy_description: "Programs and planning/building design that provide air conditioning for households and lower energy bills can increase access to cooling."

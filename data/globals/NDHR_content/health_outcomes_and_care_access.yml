# Health Outcomes and Care Access — indicator spec for the NDHR report page.
# Field contract, shape and sources: see the header of climate_and_active_design.yml.
#
# Not listed here, and deliberately: health insurance (2132) and psychiatric
# hospitalizations (2418) are UHF42-only, and maternal mortality and premature
# mortality attributed to drug use are absent from EHDP-data. See DECIDED-1.
#
# All three rows are age-adjusted or annualized rather than counts, so that ranking
# 59 community districts on them ranks the burden and not the population.

measures:

  - MeasureID: 537
    IndicatorID: 2075
    MeasureName: "Heat ED visits, Age-adjusted rate"
    IndicatorName: "Heat stress: yearly emergency department visits"
    geotype: CD
    description: "The built and natural environments, including housing quality and greenspace, are important factors shaping exposure to heat that threatens health."
    strategy: "Identify and develop a space to be a resilience hub, taking into consideration climate events such as flooding, cold or heat events"
    strategy_description: "A resilience hub is a publicly accessible facility that serves as a trusted gathering place and connects the local community to resources before, during, or after a climate event. The Housing Preservation and Development Guidelines contains a description of the components of a resilience hub."

  - MeasureID: 983
    IndicatorID: 2322
    MeasureName: "Death before 65, Age-adjusted rate"
    IndicatorName: "Premature mortality"
    geotype: CD
    description: "Communities with fewer parks, clinics, safe streets, and good housing often face higher exposure to pollution, violence, and chronic stress, increasing mortality."
    strategy: "Create community spaces and recreation areas in developments to increase social cohesion"
    strategy_description: "Creating community spaces and recreation areas increases social cohesion by facilitating regular positive social interaction, which strengthens trust and mutual support networks, leading to improved mental and physical health outcomes."

  - MeasureID: 1196
    IndicatorID: 2379
    MeasureName: "Asthma ED visits (age 5 to 17), Estimated annual rate"
    IndicatorName: "Asthma emergency department visits (age 5 to 17)"
    geotype: CD
    description: "Asthma triggers like traffic pollution, poor housing, mold, and limited greenspace can lead to more emergency care and missed school."
    strategy: "For individuals, promote good indoor air quality; for the community, leverage public spaces for vegetation that improves air quality"
    strategy_description: "Many factors affecting indoor air quality can contribute to health risks, and the Healthy Homes program contains resources to improve it. On a community level, increasing plants that serve as a barrier to air pollution could improve air quality."

# Per-category metadata for the five Neighborhood Development Health Report categories.
#
# The NDHR analogue of data/globals/NR_topics.yml, and the same division of labour:
# this file is page metadata, and data/globals/NDHR_content/<key>.yml is the
# indicator spec. The content adapter (content/ndhr/_content.gotmpl, Task 5) crosses
# this file with data/globals/cdlist.json to generate 295 report pages, 59 community
# district indexes and 5 category indexes.
#
# An array, not a map, so menu order is fixed here rather than falling out of Hugo's
# key sort. The order is the "Headers and Header Description" order of the reviewed
# source document (2026-11-19), which split Climate and Active Design in two and
# removed Mental Health.
#
# `key` is the join key: it names a file in data/globals/NDHR_content/, and it is what
# each generated page carries as `content_yml`.
#
# `facilities_layer` turns on the health care facility points
# (static/geojson/ndhr-facilities.geojson) on that category's report map. On for all
# five since Mental Health, the one category it was off for, was removed.
#
# `slug` is the URL segment, under /ndhr/<cd-slug>/<slug>/. Hyphens, where NR_topics
# uses underscores — NR's slugs reproduce URLs already indexed and this section has
# none yet, so it is a free choice rather than a compatibility one.
#
# Summaries are the header descriptions from "Text of Healthy Neighborhoods Toolkit
# [CLEAN].pdf" (reviewer email, 2026-11-19), section "Headers and Header Description",
# verbatim. The same text is the body of each category's markdown file in content/ndhr/,
# which is what the pages render; these copies feed menus and SEO.

- key: active_design
  slug: active-design
  title: "Active Design"
  menu_label: "Active Design"
  seo_short_name: "Active Design"
  seo_long_name: "Active Design — Healthy Places Toolkit"
  summary: "Active Design Guidelines 2.0: Designing for Health and Equity (ADG 2.0) is a playbook and toolkit to equitably improve the health of New Yorkers through the design of the city’s built environment. The guidelines focus on the buildings, streets and neighborhoods where we live, work and play—and the significant impact these spaces have on our daily lives."
  facilities_layer: true

- key: climate
  slug: climate
  title: "Climate"
  menu_label: "Climate"
  seo_short_name: "Climate"
  seo_long_name: "Climate — Healthy Places Toolkit"
  summary: "Climate change is driving higher temperatures and more frequent and intense rainfall and storms. Approximately 500 New Yorkers die from heat each summer."
  facilities_layer: true

- key: health_outcomes_and_care_access
  slug: health-outcomes-and-care-access
  title: "Health Outcomes and Care Access"
  menu_label: "Health Outcomes & Care Access"
  seo_short_name: "Health Outcomes and Care Access"
  seo_long_name: "Health Outcomes and Care Access — Healthy Places Toolkit"
  summary: "Health care access is not equally distributed across the city, and its availability can encourage more preventive care. Variable access to healthcare facilities contribute to disparities between communities in death rates from chronic diseases and maternal health outcomes."
  facilities_layer: true

- key: housing
  slug: housing
  title: "Housing"
  menu_label: "Housing"
  seo_short_name: "Housing"
  seo_long_name: "Housing — Healthy Places Toolkit"
  summary: "Safe, quality housing is a primary driver of health. For example, the presence of pests can exacerbate asthma, public space design near residences can impact safety and mental health. Overall housing affordability, stability, and accessibility, are factors that impact both physical and mental health."
  facilities_layer: true

- key: neighborhood_conditions
  slug: neighborhood-conditions
  title: "Neighborhood Conditions"
  menu_label: "Neighborhood Conditions"
  seo_short_name: "Neighborhood Conditions"
  seo_long_name: "Neighborhood Conditions — Healthy Places Toolkit"
  summary: "Neighborhood conditions include amenities available for public use by those living in the neighborhood, design of public spaces that create a sense of safety, and unique characteristics that give a community a sense of identity. These conditions reflect policies and investment that contribute to the overall mental and physical health of community members."
  facilities_layer: true

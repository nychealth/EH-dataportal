<!DOCTYPE html>
<head>
    <title></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.2/dist/leaflet.css" integrity="sha256-sA+zWATbFveLLNqWO2gtiw3HL/lh1giY/Inf1BJ0z14=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.2/dist/leaflet.js" integrity="sha256-o9N1jGDZrf5tS+Ft4gbIK7mYMipq9lqpVJ91xHSyKhg=" crossorigin=""></script>
    
    <!--D3-->
    <script src="https://d3js.org/d3.v5.min.js"></script>
    
    <style>
        #map {
            width:100%;
            height:120vh;
            max-width: 1000px;
        }
        
        img.traffic { 
            filter: hue-rotate(0deg); 
        }
        img.integrated-monitor{ 
            filter: hue-rotate(230deg);
        }
        img.PM-monitor { 
            filter: hue-rotate(90deg);
        }
 
        /* Legend Styles */
        .legend {
            background: white;
            opacity: 0.9;
            padding: 11px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            font-size: 13px;
            line-height: 1.6;
            min-width: 200px;
        }
        
        .legend-title {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 15px;
            border-bottom: 2px solid #333;
            padding-bottom: 6px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .legend-color {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .legend-color.traffic {
            background-color: #ac22ae;
        }
        
        .legend-color.integrated-monitor {
            background-color: #007153;
        }
        
        .legend-color.pm-monitor {
            background-color: #ae3400;
        }

        .legend-color.crz {
            background-color: #2a72d8;
        }
        
    </style>
</head>

<body>
    
    <h1 class="sr-only">Monitoring locations</h1>
    <div class="container-fluid">
        <div class="row">
            <div id="map"></div>
        </div>
    </div>
    
    
    <script>
        
        var map = L.map('map',{minZoom: 8,
            maxZoom: 16}).setView([40.715554,-74.0026642],10); // [Lat,Long],Zoom
        
        L.tileLayer(
            'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', 
            {attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'}
        ).addTo(map);
        
        // Create Legend Control
        var legend = L.control({position: 'topright'});
        
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <div class="legend-item">
                    <div class="legend-color traffic"></div>
                    <span>Traffic Counter</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color integrated-monitor"></div>
                    <span>Integrated Monitor</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color pm-monitor"></div>
                    <span>PM2.5 Real-Time Monitor</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color crz"></div>
                    <span>CRZ</span>
                </div>
            `;
            return div;
        };
        
        legend.addTo(map);
        
        
        // New GeoJSON area layer
        const cpAreaGeoJSON = {
            "type": "FeatureCollection",
            "features": [
                {
                    "type": "Feature",
                    "properties": {},
                    "geometry": {
                        "type": "LineString",
                        "coordinates": [
                            [-73.9928192, 40.7733783],
                            [-73.9817404, 40.7686493],
                            [-73.9819419, 40.7682679],
                            [-73.9741867, 40.7649115],
                            [-73.9731796, 40.765293],
                            [-73.9589786, 40.7589613],
                            [-73.9609929, 40.7560623],
                            [-73.9688488, 40.7469066],
                            [-73.9717695, 40.7440833],
                            [-73.9728774, 40.7423283],
                            [-73.9731796, 40.7409547],
                            [-73.9732803, 40.7397337],
                            [-73.9749925, 40.7366812],
                            [-73.9738851, 40.7309571],
                            [-73.9720722, 40.729507],
                            [-73.9722736, 40.7267593],
                            [-73.9751944, 40.7214926],
                            [-73.9755972, 40.7176759],
                            [-73.9766044, 40.7153094],
                            [-73.9781151, 40.7127139],
                            [-73.9791223, 40.7114924],
                            [-73.9967476, 40.7093547],
                            [-74.0039091, 40.7062205],
                            [-74.0080385, 40.7033192],
                            [-74.0100528, 40.7023266],
                            [-74.013345, 40.7014514],
                            [-74.0155607, 40.7023676],
                            [-74.0165679, 40.7049636],
                            [-74.0186829, 40.7048109],
                            [-74.0188844, 40.7068723],
                            [-74.0179779, 40.7079412],
                            [-74.0188844, 40.708323],
                            [-74.0176758, 40.7121402],
                            [-74.0166686, 40.7120638],
                            [-74.016165, 40.7133617],
                            [-74.0173736, 40.7138197],
                            [-74.0167693, 40.7185526],
                            [-74.0129421, 40.7183236],
                            [-74.0110132, 40.7285625],
                            [-74.0099352, 40.739836],
                            [-74.0093961, 40.7439201],
                            [-74.007779, 40.7480856],
                            [-74.0089649, 40.7509441],
                            [-74.0023886, 40.7606623],
                            [-74.0012027, 40.7618055],
                            [-73.9957044, 40.7679295],
                            [-73.9939795, 40.7699707],
                            [-73.9927936, 40.7733998],
                            [-73.9927936, 40.7734815]
                        ]
                    }
                }
            ]
        };

        const cpAreaLayer = L.geoJSON(cpAreaGeoJSON, {
            style: {
                color: '#2a72d8',
                weight: 4,
                opacity: 0.8,
                dashArray: '6,4'
            }
        }).addTo(map);

        if (cpAreaLayer.getBounds && cpAreaLayer.getBounds().isValid()) {
            map.fitBounds(cpAreaLayer.getBounds(), { padding: [20, 20] });
        }
        cpAreaLayer.bringToFront();

        // Site coordinates for zoom functionality
        const siteCoordinates = {
            "Deegan": { lat: 40.80911, lng: -73.928824, zoom: 16 },
            "Cross Bronx": { lat: 40.844967, lng: -73.906263, zoom: 16 },
            "BQE": { lat: 40.705511, lng: -73.958846, zoom: 16 },
            "Van Wyck": { lat: 40.690155, lng: -73.80908, zoom: 16 },
            "SI Expwy": { lat: 40.609209, lng: -74.151182, zoom: 14 },
            "FDR": { lat: 40.722282, lng: -73.974417, zoom: 14 },
            "Trans-Manhattan": { lat: 40.847353, lng: -73.934027, zoom: 16 },
        };
        
        // Function to zoom to a specific site
        window.zoomToSite = function(siteName) {
            if (siteCoordinates[siteName]) {
                const coords = siteCoordinates[siteName];
                map.setView([coords.lat, coords.lng], coords.zoom);
            }
        };
        
        // Listen for messages from parent page
        window.addEventListener('message', function(event) {
            console.log("Map received message:", event.data);
            if (event.data.action === 'zoomToSite') {
                console.log("Zooming to site:", event.data.siteName);
                window.zoomToSite(event.data.siteName);
            }
        });
        
        var sites;
        
        // using d3.csv to import csv - may use a lighter approach...?
        d3.csv('MonitoringLocations.csv').then(function(data) {

            sites = data.filter(site => site.SiteType != 'Retired Site'); // filter out Retired Sites
            // console.table(sites)
            addSitesToMap()
        })

        // var testSite = L.marker([40.748817, -73.985428]).addTo(map).bindPopup('This is TEST.');
        var testIcon = L.icon({
            iconUrl: 'map-pin-hollow_P.svg',
            
            iconSize:     [32, 32], // size of the icon
            iconAnchor:   [16, 32], // point of the icon which will correspond to marker's location
            popupAnchor:  [-3, -30] // point from which the popup should open relative to the iconAnchor
        })
        
        var testIcon2 = L.icon({
            iconUrl: 'map-pin-solid-full.svg',
            
            iconSize:     [33, 82], // size of the icon
            iconAnchor:   [22, 94], // point of the icon which will correspond to marker's location
            popupAnchor:  [-3, -76] // point from which the popup should open relative to the iconAnchor
        });
        
        // loop through MonitoringLocations.csv, add them to map as points
        function addSitesToMap() {
            
            for (let i = 0; i < sites.length; i++) {

                {{/*  console.log(">>> site data", sites[i]);  */}}
                
                var site = 
                    L.marker([Number(sites[i].Latitude), Number(sites[i].Longitude)], {icon: testIcon})
                        .bindPopup("Site ID: " + sites[i].SiteID + "<br><strong>Type: </strong>" + sites[i].SiteType + "<br>Group: " + sites[i].Group) // popup content
                        .addTo(map) // add to map
                
                // setting up zoom on click
        
                site.on('click', function (e) {
                    map.setView(e.latlng, 13);
                    // updateData(monitor_locations[i].loc_col)
                });

                // console.log(">>>> site", site._popup._content)
                // console.log(">>> site marker", site)
                
                // style based on SiteType (or, use: https://github.com/pointhi/leaflet-color-markers)
                
                if (sites[i].SiteType === 'Traffic Counter') {
                    // color for routine site
                    site._icon.classList.add("traffic");
                } else if (sites[i].SiteType === 'Integrated Monitor') {
                    // color for EJ site // 
                    site._icon.classList.add("integrated-monitor");
                } else if (sites[i].SiteType === 'PM2.5 Real-Time Monitor') {
                    // color for EJ site
                    site._icon.classList.add("PM-monitor");
                } else {
                    // color for retired site
                    site._icon.classList.add("BC-monitor");
                }
                
                // icon based on SiteType CONFIGURE (or, use: https://github.com/pointhi/leaflet-color-markers)
                if (sites[i].SiteType === 'Traffic Counter') {
                    // color for routine site
                    site._icon.classList.add("traffic");
                } else if (sites[i].SiteType === 'Integrated Monitor') {
                    // color for EJ site // 
                    site._icon.classList.add("integrated-monitor");
                } else if (sites[i].SiteType === 'PM2.5 Real-Time Monitor') {
                    // color for EJ site
                    site._icon.classList.add("PM-monitor");
                } else {
                    // color for retired site
                    site._icon.classList.add("BC-monitor");
                }
            }
        }
        
    </script>
    
    
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    
</body>
</html>

name: Check deployment

# check to see if most recent build had been deployed

on:
  schedule:
    - cron: '11 0 * * 1-5' # every weekday at 00:11 Eastern
      timezone: "America/New_York"
  workflow_dispatch:

# Reads builds/prod-prod and sends mail; it writes nothing to the repository.

permissions:
  contents: read

jobs:
  check_deploy:
    name: Check deployment
    runs-on: ubuntu-24.04

    # define job's steps

    steps:

      # checkout
      
      - name: checkout builds/prod-prod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: builds/prod-prod
          fetch-depth: 0
          # Nothing here pushes, so the token is not left in .git/config while the
          # third-party mail action runs.
          persist-credentials: false

      # built hash
      
      - name: get built hash
        id: b_hash
        run: |
          echo "Current branch: $(git branch --show-current)"
          echo "built_hash=$(git log -1 --format=%H)" >> $GITHUB_OUTPUT

      # deployed hash

      # -f fails on a 4xx/5xx, where -s alone handed the server's 41 KB HTML error page to
      # the comparison and to git rev-list (audit N-036). The format check catches a 200
      # that is not a commit hash, so later steps only ever see 40 hex characters.

      - name: get deployed hash
        id: d_hash
        run: |
          deployed_hash="$(curl -fsS https://a816-dohbesp.nyc.gov/indicatorpublic/commit_hash.txt | tr -d '[:space:]')"
          if ! [[ "$deployed_hash" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_hash.txt did not hold a commit hash"
            exit 1
          fi
          echo "deployed_hash=$deployed_hash" >> $GITHUB_OUTPUT

      # echo hash

      - name: echo outputs
        id: echo
        run: |
          echo "built_hash: ${{ steps.b_hash.outputs.built_hash }}"
          echo "deployed_hash: ${{ steps.d_hash.outputs.deployed_hash }}"
          hashes_equal=$([ ${{ steps.b_hash.outputs.built_hash }} = ${{ steps.d_hash.outputs.deployed_hash }} ] && echo yes || echo no)
          echo "hashes_equal: $hashes_equal"
      
      # if hashes aren't equal:
      
      # ...get commit logs...

      - name: last commit log
        id: log

        if: steps.b_hash.outputs.built_hash != steps.d_hash.outputs.deployed_hash

        run: |
          echo "commit_count=$(git rev-list --count ${{ steps.d_hash.outputs.deployed_hash }}..${{ steps.b_hash.outputs.built_hash }})" >> $GITHUB_OUTPUT
          echo -e "$(git log ${{ steps.d_hash.outputs.deployed_hash }}..${{ steps.b_hash.outputs.built_hash }} --pretty='format:%C(auto)%h (%s, %cs)%n<br/><hr/>')\n<br/><br/>" > log.txt

      - name: log output
        id: log_output

        if: steps.b_hash.outputs.built_hash != steps.d_hash.outputs.deployed_hash

        run: |
          echo "commit_count: ${{ steps.log.outputs.commit_count }}"
          cat log.txt

      # ...and send en email saying that we need to deploy

      - name: send reminder
        id: send
        
        if: steps.b_hash.outputs.built_hash != steps.d_hash.outputs.deployed_hash

        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59 # v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          subject: Pending deployment on ${{ github.repository }} (${{ steps.log.outputs.commit_count }} commits)
          html_body: file://log.txt
          to: cgettings@health.nyc.gov,etorem@health.nyc.gov
          from: "Chris Gettings (via gmail) <${{ secrets.MAIL_USERNAME }}>"
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

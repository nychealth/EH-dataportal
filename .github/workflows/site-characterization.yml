name: Site characterization report

# Builds the site twice — this PR (merged onto its base) and the base branch
# tip — loads every page of each, and reports which pages' rendered STRUCTURE
# differs: an asset that stopped loading, a heading level that started
# skipping, a lost alt or <th>, an iframe at zero height, JSON-LD that stopped
# being an object. Complements the Hugo build (which only proves the templates
# compile) and smoke.yml (which only fails on JS that throws).
#
# REPORT-ONLY. A difference never fails this workflow; the report is posted as
# one PR comment, edited in place on every push. The workflow fails only when
# the comparison could not be made at all (a tree that does not build, a page
# that does not load), because a report that silently did not run must not
# look like one that found nothing. Decisions and proofs:
# documents/characterization-pr-diff-plan-2026-11-18.md.
#
# Why both sides are built here rather than diffed against a committed
# baseline: a report-only check against a baseline accumulates every merged
# change nobody re-captured. Built minutes apart, both sides also fetch the same
# EHDP-data, so a data change moves both and cancels out — which is why the old
# "was the base branch red too?" job is gone.
#
# Both sides build with `--environment prod_prod` against EHDP-data's
# `production` branch: the site that is about to deploy, with the data it will
# deploy against (head.html:46-53 branches on the environment NAME).
#
# Analytics do not fire. prod_prod emits the production GA property, and its
# only transport is gtag.js from www.googletagmanager.com — a host the harness
# aborts at the network layer.

on:
  pull_request:
    branches:
      - production
      - development

    # A docs-only push should not spend two full sweeps. Nothing listed here can
    # reach a rendered page: Hugo builds from content/, themes/, assets/, data/,
    # static/, config/ and archetypes/, and none of these are among them
    # `[verified 2026-08-24: across themes/, content/, config/, data/, assets/
    # and static/, the only mentions of documents/ or memories/ are two HTML
    # comments citing an audit doc]`.
    #
    # Deliberately NOT ignored: content/**/*.md is the site's own copy, so a
    # blanket `**.md` would skip real content changes. Keep this list explicit
    # rather than pattern-based.
    #
    # WARNING: do not make this a REQUIRED status check while it has a path
    # filter. GitHub: "Associated checks stay in a 'Pending' state and block
    # merging" when a workflow is skipped by path filtering
    # `[docs.github.com/en/pull-requests/collaborating-with-pull-requests/
    # collaborating-on-repositories-with-code-quality-features/
    # troubleshooting-required-status-checks, read 2026-08-24]`.
    #
    # The workflow entries are an explicit enumeration of every workflow BUT
    # this one — a change to this file must re-run this check. A workflow added
    # later is not covered until it is listed; diff these entries against
    # `ls .github/workflows/` to find one.
    paths-ignore:
      - documents/**
      - memories/**
      - .claude/**
      - .agents/**
      - .github/instructions/**
      - .github/pull_request_template.md
      - .github/workflows/check-deploy.yml
      - .github/workflows/codeql.yml
      - .github/workflows/hugo-build-any-branch.yml
      - .github/workflows/hugo-build-to-dev-prod.yml
      - .github/workflows/hugo-build-to-prod-prod.yml
      - .github/workflows/smoke.yml
      - .github/workflows/test-print-branch.yml
      - .gitignore
      - CLAUDE.md
      - README.md
      - readme-components.md
      - readme-content.md
      - readme-development.md
      - LICENSE
      - eslint.config.mjs
      - skills-lock.json
      - trigger_prod-prod_workflow.ps1
      - trigger_prod-prod_workflow.sh

  workflow_dispatch:

    inputs:

      scope:
        description: Pages to compare
        required: false
        type: choice
        default: all
        options:
          - all
          - sample

      content:
        description: Also compare titles, heading text and link targets
        required: false
        type: boolean
        default: false

# Read-only by default; only the comment job below gets a write scope.
permissions:
  contents: read

env:
  TZ: America/New_York

jobs:

  # ------------------------------------------
  # build both sides and compare what renders
  # ------------------------------------------

  compare:
    name: Compare rendered structure with the base branch
    runs-on: ubuntu-24.04

    # ~2x the measured work. On the first run the setup steps took 67s and the
    # comparison itself 11m29s: two builds of ~43s each and two 840-page sweeps
    # of ~5m at concurrency 6 on 4 logical processors `[run 44461996966,
    # 2026-11-19: "Report written" at 05:11:49, step started 05:00:20]`. That
    # run then hung to the old 30-minute limit on surviving hugo processes,
    # since fixed in isolated-server.mjs's makeStop.
    timeout-minutes: 25

    concurrency: # one run per ref; a superseded push does not need its own sweep
      group: ${{ github.workflow }}-${{ github.ref_name }}
      cancel-in-progress: true

    steps:

      # NO `ref:` on this checkout: on a pull_request event actions/checkout takes
      # refs/pull/N/merge, the PR head already merged onto the base tip — the
      # site as it would be after merging, which is the head side we want.
      # fetch-depth 1: the compare reads `git rev-parse HEAD` and nothing older.

      - name: Checkout this PR (merged onto its base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # base.sha is the BASE BRANCH TIP, not the merge base `[verified 2026-08-24
      # on PR #1480]` — the tip is what this PR merges into, so it is the right
      # comparison, and it needs no history. A manual run has no PR, so it
      # compares the branch it was dispatched on against production.

      - name: Checkout the base branch tip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || 'production' }}
          path: base
          fetch-depth: 1

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: "npm"

      # Two installs, because each tree builds with ITS OWN locked hugo-extended
      # (isolated-server.mjs prefers <tree>/node_modules/.bin/hugo), and Hugo
      # mounts node_modules into assets/. The root install also runs the harness.

      - name: Install dependencies (this PR)
        run: npm ci

      - name: Install dependencies (base branch)
        working-directory: base
        run: npm ci

      # hugo-extended is an OPTIONAL dependency, so a failed platform binary
      # install is silent. Fail here, where the message is legible.

      - name: Confirm both locked Hugo binaries are present
        run: |
          npx hugo version
          (cd base && npx hugo version)

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The compare starts both servers itself (base on :8091, head on :8090,
      # each writing outside both trees), builds Pagefind into each, captures,
      # re-captures differing pages alone on both sides, and writes the report.
      # --report-only: exit 0 on differences, 2 when it could not compare.
      #
      # GITHUB_TOKEN is passed for the EHDP-data commit lookup, which otherwise
      # runs unauthenticated at 60 requests an hour per shared runner IP
      # `[measured 2026-08-26: x-ratelimit-limit 60 without, 5000 with]`.

      - name: Compare
        id: compare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args="prod_prod"
          if [ "${{ inputs.scope }}" = "sample" ]; then
            args="$args sample"
          fi
          args="$args --base-tree base --report-only --report sc-report.md"
          if [ "${{ inputs.content }}" = "true" ]; then
            args="$args --content"
          fi
          echo "node scripts/site-characterization-compare.mjs $args"
          node scripts/site-characterization-compare.mjs $args

      # The comment job reads this. always(), so a report written before a later
      # failure still reaches the PR; a missing one is the comment job's cue to
      # say the comparison did not run.

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sc-report
          path: sc-report.md
          retention-days: 14
          if-no-files-found: ignore

      # Both captures and their projections, for diffing locally. Gated on the
      # step's own outcome rather than failure(): a job cancelled by
      # timeout-minutes skips failure() steps while still running always() ones
      # `[run 32802721473, 2026-08-25]`. .sc-compare is a dot directory, which
      # the action skips unless told otherwise.

      - name: Upload the captures
        if: always() && steps.compare.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sc-captures-${{ github.run_id }}
          path: scripts/.sc-compare/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

      # The compare stops its own servers in a finally block; this is for a run
      # cancelled before that block runs. The runner is ephemeral and
      # single-purpose, so the only hugo on it is this job's.

      - name: Stop any surviving Hugo server
        if: always()
        run: pkill -TERM -x hugo 2>/dev/null || true

  # ------------------------------------------
  # post the report as one PR comment
  # ------------------------------------------

  # A separate job so the write scope never sits beside a step that runs PR
  # code. Skipped for manual runs (no PR) and for PRs from forks, whose token is
  # read-only — the report is still in the compare job's step summary there.

  comment:
    name: Post the report to the PR
    needs: compare
    if: >-
      always()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      pull-requests: write

    steps:

      - name: Download the report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sc-report

      # One comment per PR: find this job's earlier comment by the marker the
      # compare script writes as the report's first line, and edit it; post a
      # new one only when there is none. Without this a PR pushed six times
      # collects six reports.
      #
      # Truncated below GitHub's comment-body limit, with the run link always
      # last so a truncated report still says where the rest is.
      #
      # The footer @mentions the PR's author, because a plain bot comment did
      # not reach them by email (Chris, 2026-11-19, PR #1583) and a mention
      # notifies whatever the reader's watch settings. Skipped for bot authors
      # such as dependabot[bot]. The author login comes from the event payload,
      # not from PR text, so it cannot carry anything but a real login.

      - name: Create or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMPARE_RESULT: ${{ needs.compare.result }}
          # The PR branch's own tip. GITHUB_SHA here is the merge commit, which
          # names nothing the author can find in their branch.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          marker="<!-- site-characterization-report -->"
          limit=60000

          if [ -s sc-report.md ]; then
            head -c "$limit" sc-report.md > body.md
            if [ "$(wc -c < sc-report.md)" -gt "$limit" ]; then
              printf '\n\n**Report truncated** — the full report is in the run summary.\n' >> body.md
            fi
          else
            {
              echo "$marker"
              echo "## Site characterization: no report"
              echo
              echo "The compare job ended \`${COMPARE_RESULT}\` before writing a report, so nothing"
              echo "was compared. Its log says why — usually a tree that did not build or a page"
              echo "that did not load."
            } > body.md
          fi
          printf '\n[Run log](%s) · PR head %s\n' "$RUN_URL" "${HEAD_SHA:0:10}" >> body.md
          case "$AUTHOR" in
            *"[bot]") ;;
            *) printf '\ncc @%s\n' "$AUTHOR" >> body.md ;;
          esac

          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)

          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md --jq '.html_url'
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@body.md --jq '.html_url'
          fi

name: Hugo Build from any branch

# run action on a merged PR on "production"

on:
  workflow_dispatch:

    inputs:

      branch:
        description: Branch to build
        required: false
        type: string

      publish-branch:
        description: Branch name for build files
        required: false
        type: string

      environment:
        description: environment for Hugo
        required: false
        type: string
        default: production
      
      baseURL:
        description: baseURL for Hugo
        required: false
        type: string

# Read-only by default; the build job asks for write itself, to push builds/<branch>.

permissions:
  contents: read

env:
  publish_branch: ${{ inputs.publish-branch && inputs.publish-branch || inputs.branch && inputs.branch || github.ref_name && github.ref_name }}
  HUGO_GIT_BRANCH: ${{ inputs.branch && inputs.branch || github.ref_name && github.ref_name }}
  TZ: America/New_York
  
jobs:

  # ------------------
  # build to the branch
  # ------------------

  build:
    runs-on: ubuntu-24.04
    # can't use the "env" context at the job level, only in steps, so need to eval the conditional again
    name: Build `${{ inputs.branch && inputs.branch || github.ref_name && github.ref_name }} to builds/${{ inputs.publish-branch && inputs.publish-branch || inputs.branch && inputs.branch || github.ref_name && github.ref_name }}`

    permissions:
      contents: write

    # wait for other triggered jobs to finish before running this

    concurrency: # don't run two of these jobs at the same time
      group: ${{ github.workflow }}-${{ inputs.branch }} # use the given branch name, so only one job on a branch will run at a time
      cancel-in-progress: true # this makes it so that only the most recent job is run

    # define job's steps

    steps:

      # builds/prod-prod is the deploy source and belongs to hugo-build-to-prod-prod.yml
      # alone. This workflow's environment input defaults to `production`, which emits
      # noindex and the dev analytics property, so a run publishing there could put a
      # non-indexable site on the deploy branch (audit N-035; Chris, 2026-11-07: refuse it).

      - name: Refuse to publish to builds/prod-prod
        run: |
          if [ "${publish_branch//[[:space:]]/}" = "prod-prod" ]; then
            echo "::error::builds/prod-prod is published only by hugo-build-to-prod-prod.yml"
            exit 1
          fi

      # setting line endings to LF to match line endings in source files (which were used to compute resource integrity)

      - name: set git EOL
        run: |
          git config --global core.eol lf
          git config --global core.autocrlf input

      # using checkout action

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          # Nothing in this job pushes with the checkout's credentials: the publish step
          # passes its own token. So the token is not left in .git/config during npm ci.
          persist-credentials: false

      # get last commit. The subject and the dispatch inputs reach later steps through
      # env:, never pasted into a script with ${{ }}, where a quote in a subject broke
      # the build and $(...) or backticks in it ran as commands (audit N-030).

      - name: get last commit
        id: last_commit
        run: |
          echo "last_hash=$(git log -1 --format=%h --abbrev=10)" >> $GITHUB_OUTPUT
          echo "last_msg=$(git log -1 --format=%s)" >> $GITHUB_OUTPUT

      # set up node and cache for npm

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: "npm"

      # npm ci, not npm install: install exactly what the reviewed lockfile says. npm install
      # re-resolved it here and a commit-back step pushed the result after review
      # (audit A-079, N-038). A lockfile out of sync with package.json now fails here.

      - name: Install dependencies
        run: npm ci

      # list dependencies
      
      - name: List dependencies
        run: npm ls

      - name: List sub-dependencies
        run: npm ls --all
      
      # convert all line endings to Unix

      - name: Update Ubuntu package index
        run: sudo apt-get update
        
      - name: Install software
        run: sudo apt-get install -y dos2unix
        
      - name: Convert line endings
        run: |
          find . -name '*.js' -print0 | xargs -0 dos2unix
          find . -name '*.css' -print0 | xargs -0 dos2unix
      
      # set up Hugo

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.147.3"
          extended: true

      # build site with Hugo

      # if only environment is specified
      
      - name: Hugo Build environment
        if: ${{ ! inputs.baseURL }}
        env:
          HUGO_GIT_LAST_HASH: ${{ steps.last_commit.outputs.last_hash }}
          HUGO_GIT_LAST_MSG: ${{ steps.last_commit.outputs.last_msg }}
          BUILD_ENVIRONMENT: ${{ inputs.environment }}
        run: hugo --environment "$BUILD_ENVIRONMENT" --cleanDestinationDir --logLevel debug

      # if baseURL is also specified

      - name: Hugo Build environment + baseURL
        if: ${{ inputs.baseURL }}
        env:
          HUGO_GIT_LAST_HASH: ${{ steps.last_commit.outputs.last_hash }}
          HUGO_GIT_LAST_MSG: ${{ steps.last_commit.outputs.last_msg }}
          BUILD_ENVIRONMENT: ${{ inputs.environment }}
          BUILD_BASE_URL: ${{ inputs.baseURL }}
        run: hugo --environment "$BUILD_ENVIRONMENT" --baseURL "$BUILD_BASE_URL" --cleanDestinationDir --logLevel debug


      # run pagefind

      - name: Build search with pagefind
        run: |
          cd "$GITHUB_WORKSPACE"
          npx -y pagefind --site docs

      # publish to "deploy" branch. An action input is not a script, so ${{ }} is safe
      # here; the quotes keep the commit message's ("<subject>") form.

      - name: Publish to "builds/${{ env.publish_branch }}"
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          full_commit_message: 'Publish ${{ steps.last_commit.outputs.last_hash }} ("${{ steps.last_commit.outputs.last_msg }}") to "builds/${{ env.publish_branch }}"'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds/${{ env.publish_branch }} 
          publish_dir: ./docs/
          enable_jekyll: false

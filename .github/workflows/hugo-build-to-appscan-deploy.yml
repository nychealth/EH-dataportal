name: Hugo Build to `appscan-deploy` branch

# run action on a merged PR on "build-to-appscan-deploy"

on:
  push:
    branches:
      - build-to-appscan-deploy
  pull_request:
    branches:
      - build-to-appscan-deploy
    types:
      - closed
  workflow_dispatch:

env:
  HUGO_GIT_BRANCH: build-to-appscan-deploy
  TZ: America/New_York


jobs:

  # ------------------
  # build to appscan-deploy
  # ------------------
  
  build:
    name: Build `build-to-appscan-deploy` to `builds/appscan-deploy`
    runs-on: ubuntu-22.04

    # only run the action if it's a push, or the PR was merged, or it was manually triggered

    if: github.event_name == 'push' || github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    # wait for other triggered jobs to finish before running this

    concurrency: # don't run two of these jobs at the same time
      group: ${{ github.workflow }}-${{ github.ref_name }} # ref name is branch name, so only one job on a branch will run at a time
      cancel-in-progress: true # this makes it so that only the most recent job is run

    # define job's steps

    steps:

      # setting line endings to LF to match line endings in source files (which were used to compute resource integrity)

      - name: set git EOL
        run: |
          git config --global core.eol lf
          git config --global core.autocrlf input

      # using checkout action

      - name: Checkout
        uses: actions/checkout@v4
        with: 
          ref: build-to-appscan-deploy
          fetch-depth: 0

      # get last commit

      - name: get last commit
        id: last_commit
        run: |
          echo "last_hash=$(git log -1 --format=%h --abbrev=10)" >> $GITHUB_OUTPUT
          echo "last_msg=\"$(git log -1 --format=%s)\"" >> $GITHUB_OUTPUT
      
      # set up node and cache for npm

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22.5.x
          cache: "npm"

      # install npm dependencies

      - name: Install dependencies
        run: npm install

      # list dependencies
      
      - name: List dependencies
        run: npm ls

      - name: List sub-dependencies
        run: npm ls --all
      
      # convert all line endings to Unix

      - name: Update Ubuntu package index
        run: sudo apt-get update
        
      - name: Install software
        run: sudo apt-get install -y dos2unix
        
      - name: Convert line endings
        run: find . -name '*.js' -or -name '*.css' -print0 | xargs -0 dos2unix
      
      # set up Hugo

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.145.0"
          extended: true

      # build site with Hugo

      - name: Build site with Hugo
        run: hugo --environment appscan_deploy --cleanDestinationDir --logLevel debug

      # run pagefind

      - name: Build search with pagefind
        run: |
          cd '${{ github.workspace }}'
          npx -y pagefind --site docs

      # commit built index

      - name: Commit changes to package.json & package-lock.json
        uses: elstudio/actions-js-build/commit@v4
        with:
          commitMessage: Update index & NPM package list

      # publish to "deploy" branch

      - name: Publish to "builds/appscan-deploy"
        uses: peaceiris/actions-gh-pages@v4
        with:
          full_commit_message: "Build ${{ steps.last_commit.outputs.last_hash }} (${{ steps.last_commit.outputs.last_msg }})"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds/appscan-deploy
          publish_dir: ./docs/
          enable_jekyll: false
